<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    try {
      var _t = localStorage.getItem("research-theme");
      if (_t === "light" || _t === "dark") document.documentElement.setAttribute("data-theme", _t);
    } catch (e) {}
  </script>
  <title>{% block title %}research{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
  <div class="layout-root">
  <aside class="layout-sidebar" aria-label="Site">
    <div class="sidebar-header">
      <a class="sidebar-brand" href="/viewer/">
        <span class="sidebar-brand__mark" aria-hidden="true">R</span>
        <span class="sidebar-brand__text">
          <span class="sidebar-brand__title">Research</span>
          <span class="sidebar-brand__sub">Notes vault</span>
        </span>
      </a>
      <div class="sidebar-search" style="margin-top:1rem;">
        <label for="vault-search">Search</label>
        <form method="get" action="/viewer/search" class="search-form">
          <div class="search-field">
            <span class="search-field__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input
              id="vault-search"
              type="search"
              name="q"
              value="{{ initial_search_q | default('') | e }}"
              autocomplete="off"
              placeholder="Titles and content…"
              aria-label="Search notes"
              hx-get="/viewer/search"
              hx-trigger="keyup[key!='Enter'] changed delay:280ms, search"
              hx-target="#search-results"
              hx-indicator="#search-indicator"
            />
          </div>
        </form>
        <p id="search-indicator" class="htmx-indicator search-indicator-status">Searching…</p>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-favorites-block">
        <div class="nav-label nav-label--favorites-heading">Favorites</div>
        <div id="favorites-root" class="favorites-root">
          {% include "_favorites_fragment.html" %}
        </div>
      </div>
      <div class="nav-label nav-label--browse-heading">Browse</div>
      <div class="tree-filter">
        <label for="tree-filter-input" class="tree-filter__label">Filter tree titles</label>
        <input
          id="tree-filter-input"
          type="search"
          placeholder="Match note / folder names…"
          autocomplete="off"
          aria-label="Filter sidebar tree by title"
        />
      </div>
      <div id="browse-tree-root" class="browse-tree-root">
        {% from "_tree.html" import render_tree %}
        {{ render_tree(tree, current_path | default("")) }}
      </div>
    </div>
    <div class="sidebar-footer">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
        <!-- Heroicons v2 outline (MIT): moon → switch to dark -->
        <svg
          class="theme-toggle__icon theme-toggle__moon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"
          />
        </svg>
        <!-- sun → switch to light -->
        <svg
          class="theme-toggle__icon theme-toggle__sun"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
          />
        </svg>
      </button>
      <div class="sidebar-footer__links">
        <a href="/docs" target="_blank" rel="noopener noreferrer">API reference</a>
        ·
        <a href="/api/search/?q=" target="_blank" rel="noopener noreferrer">JSON search</a>
      </div>
    </div>
  </aside>
  <div class="layout-main">
    <div class="layout-main__inner">
      <div id="doc-layout" class="doc-layout {% block doc_layout_mod %}{% endblock %}">
        <main id="main">
          {% block main %}{% endblock %}
        </main>
        <aside class="layout-right-sidebar" aria-label="Note metadata">
          <div class="layout-right-sidebar__scroll">
            {% block right_sidebar %}{% endblock %}
          </div>
        </aside>
      </div>
    </div>
  </div>
  </div>
  <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <script>
    (function () {
      var THEME_KEY = "research-theme";

      function storedTheme() {
        try {
          var t = localStorage.getItem(THEME_KEY);
          return t === "light" || t === "dark" ? t : null;
        } catch (e) {
          return null;
        }
      }

      function effectiveDark() {
        var root = document.documentElement;
        var attr = root.getAttribute("data-theme");
        if (attr === "dark") return true;
        if (attr === "light") return false;
        return window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      function mermaidThemeName() {
        return effectiveDark() ? "dark" : "neutral";
      }

      if (typeof mermaid !== "undefined") {
        try {
          mermaid.initialize({
            startOnLoad: true,
            theme: mermaidThemeName(),
            securityLevel: "loose",
          });
        } catch (e) {}
      }

      document.body.addEventListener("htmx:afterSwap", function (e) {
        if (!e.detail || !e.detail.target || typeof mermaid === "undefined") return;
        try {
          mermaid.run({ nodes: e.detail.target.querySelectorAll(".mermaid") });
        } catch (_) {}
      });

      document.body.addEventListener("htmx:afterSwap", function (e) {
        var tgt = e.detail && e.detail.target;
        if (!tgt || (tgt.id !== "main" && tgt.id !== "doc-layout")) return;
        document.querySelectorAll(".tree a.is-active").forEach(function (el) {
          el.classList.remove("is-active");
        });
        var path = window.location.pathname;
        document.querySelectorAll(".tree a[href]").forEach(function (a) {
          if (a.getAttribute("href") === path) a.classList.add("is-active");
        });
      });

      function initBrowseTreeFilter() {
        var root = document.getElementById("browse-tree-root");
        var input = document.getElementById("tree-filter-input");
        if (!root || !input) return;

        var preFilterDetailsOpen = null;

        function depth(li) {
          var d = 0;
          var e = li;
          while (e && e !== root) {
            if (e.tagName === "LI") d++;
            e = e.parentElement;
          }
          return d;
        }

        function apply() {
          var query = input.value.trim().toLowerCase();
          var lis = Array.prototype.slice.call(root.querySelectorAll("li"));

          if (!query) {
            lis.forEach(function (li) {
              li.classList.remove("tree-filter-hidden", "tree-filter-match");
            });
            if (preFilterDetailsOpen) {
              preFilterDetailsOpen.forEach(function (rec) {
                rec.el.open = rec.open;
              });
              preFilterDetailsOpen = null;
            }
            return;
          }

          if (!preFilterDetailsOpen) {
            preFilterDetailsOpen = [];
            root.querySelectorAll("details.tree-branch").forEach(function (d) {
              preFilterDetailsOpen.push({ el: d, open: d.open });
            });
          }

          lis.sort(function (a, b) {
            return depth(b) - depth(a);
          });

          lis.forEach(function (li) {
            li.classList.remove("tree-filter-match");
            var link = li.querySelector(":scope > a");
            var branch = li.querySelector(":scope > details.tree-branch");
            var match = false;
            if (link) {
              match = link.textContent.trim().toLowerCase().includes(query);
            } else if (branch) {
              var summary = branch.querySelector(":scope > summary");
              var dirLabel = (summary ? summary.textContent : "")
                .replace(/\//g, "")
                .trim()
                .toLowerCase();
              var ul = branch.querySelector(":scope > ul");
              var anyChild = ul
                ? Array.prototype.some.call(ul.children, function (childLi) {
                    return childLi.classList.contains("tree-filter-match");
                  })
                : false;
              match = dirLabel.includes(query) || anyChild;
            }
            li.classList.toggle("tree-filter-match", match);
            li.classList.toggle("tree-filter-hidden", !match);
            if (branch && match) branch.open = true;
          });
        }

        var debounce = null;
        input.addEventListener("input", function () {
          clearTimeout(debounce);
          debounce = setTimeout(apply, 140);
        });
        input.addEventListener("search", function () {
          if (!input.value) apply();
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            input.value = "";
            apply();
          }
        });
      }

      var btn = document.getElementById("theme-toggle");
      function paintToggle() {
        if (!btn) return;
        var dark = effectiveDark();
        btn.classList.toggle("is-dark", dark);
        var label = dark ? "Switch to light theme" : "Switch to dark theme";
        btn.setAttribute("aria-label", label);
        btn.setAttribute("title", label);
        btn.setAttribute("aria-pressed", dark ? "true" : "false");
      }
      paintToggle();
      if (btn) {
        btn.addEventListener("click", function () {
          var next = effectiveDark() ? "light" : "dark";
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch (e) {}
          location.reload();
        });
      }
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (storedTheme()) return;
        paintToggle();
      });

      initBrowseTreeFilter();
    })();
  </script>
  <script>
    (function () {
      var toastHideTimer = null;
      var toastRemoveTimer = null;

      function dismissPaperSaveToast(kind) {
        if (toastHideTimer) {
          clearTimeout(toastHideTimer);
          toastHideTimer = null;
        }
        if (toastRemoveTimer) {
          clearTimeout(toastRemoveTimer);
          toastRemoveTimer = null;
        }
        if (kind === "saving") return;
        var ms = kind === "error" ? 5200 : 2800;
        toastHideTimer = setTimeout(function () {
          var stack = document.getElementById("toast-stack");
          var el = stack && stack.firstElementChild;
          if (!el || el.nodeType !== 1 || !el.classList.contains("toast")) return;
          el.classList.remove("toast--visible");
          toastRemoveTimer = setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 240);
        }, ms);
      }

      function paperSaveToast(kind, message) {
        var stack = document.getElementById("toast-stack");
        if (!stack) return;
        if (toastHideTimer) {
          clearTimeout(toastHideTimer);
          toastHideTimer = null;
        }
        if (toastRemoveTimer) {
          clearTimeout(toastRemoveTimer);
          toastRemoveTimer = null;
        }
        stack.innerHTML = "";
        var el = document.createElement("div");
        el.className = "toast toast--" + kind;
        el.textContent = message;
        stack.appendChild(el);
        requestAnimationFrame(function () {
          el.classList.add("toast--visible");
        });
        dismissPaperSaveToast(kind);
      }

      function refreshFavorites() {
        var el = document.getElementById("favorites-root");
        if (!el) return;
        fetch("/viewer/fragments/favorites")
          .then(function (r) {
            return r.text();
          })
          .then(function (html) {
            el.innerHTML = html;
          })
          .catch(function () {});
      }

      function updatePaperDependencyControls(panel) {
        var abSel = panel.querySelector('select[name="paper_abstract"]');
        var coSel = panel.querySelector('select[name="paper_content"]');
        var reSel = panel.querySelector('select[name="paper_reproduced"]');
        if (!abSel || !coSel || !reSel) return;
        var ab = abSel.value;
        var co = coSel.value;

        coSel.disabled = ab !== "READ";

        if (ab !== "READ") {
          coSel.value = "UNREAD";
          co = "UNREAD";
        }

        reSel.disabled = co === "UNREAD";
        if (reSel.disabled) {
          reSel.value = "NO";
        }
      }

      function applyServerRow(panel, row) {
        var abSel = panel.querySelector('select[name="paper_abstract"]');
        var coSel = panel.querySelector('select[name="paper_content"]');
        var reSel = panel.querySelector('select[name="paper_reproduced"]');
        var favBtn = panel.querySelector(".paper-favorite-toggle");
        var ftext = panel.querySelector(".paper-favorite-toggle__text");
        if (abSel) abSel.value = row.paper_abstract;
        if (coSel) coSel.value = row.paper_content;
        if (reSel) reSel.value = row.paper_reproduced;
        if (favBtn) {
          var on = !!row.paper_favorite;
          favBtn.setAttribute("aria-pressed", on ? "true" : "false");
          if (ftext) ftext.textContent = on ? "Favorited" : "Add to favorites";
        }
        updatePaperDependencyControls(panel);
      }

      function patchPaperMetadata(panel) {
        var path = panel.getAttribute("data-note-path");
        if (!path) return;
        var abSel = panel.querySelector('select[name="paper_abstract"]');
        var coSel = panel.querySelector('select[name="paper_content"]');
        var reSel = panel.querySelector('select[name="paper_reproduced"]');
        var favBtn = panel.querySelector(".paper-favorite-toggle");
        if (!abSel || !coSel || !reSel || !favBtn) return;

        paperSaveToast("saving", "Saving…");

        fetch("/api/papers/" + encodeURIComponent(path), {
          method: "PATCH",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            paper_abstract: abSel.value,
            paper_content: coSel.value,
            paper_reproduced: reSel.value,
            paper_favorite: favBtn.getAttribute("aria-pressed") === "true",
          }),
        })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (row) {
            applyServerRow(panel, row);
            paperSaveToast("success", "Saved");
            refreshFavorites();
          })
          .catch(function () {
            paperSaveToast("error", "Save failed");
          });
      }

      function bindPaperMetadataPanel(panel) {
        if (!panel.classList.contains("paper-metadata-panel")) return;
        if (panel.dataset.pmBound === "1") return;
        panel.dataset.pmBound = "1";
        updatePaperDependencyControls(panel);

        panel.querySelectorAll("select.paper-prop-input").forEach(function (el) {
          el.addEventListener("change", function () {
            updatePaperDependencyControls(panel);
            patchPaperMetadata(panel);
          });
        });

        var favBtn = panel.querySelector(".paper-favorite-toggle");
        if (favBtn) {
          favBtn.addEventListener("click", function () {
            var on = favBtn.getAttribute("aria-pressed") === "true";
            favBtn.setAttribute("aria-pressed", on ? "false" : "true");
            updatePaperDependencyControls(panel);
            patchPaperMetadata(panel);
          });
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".paper-metadata-panel").forEach(bindPaperMetadataPanel);
      });

      document.body.addEventListener("htmx:afterSwap", function (e) {
        var tgt = e.detail && e.detail.target;
        if (!tgt || tgt.id !== "doc-layout") return;
        var panel = document.querySelector(".paper-metadata-panel");
        if (panel) bindPaperMetadataPanel(panel);
      });
    })();
  </script>
</body>
</html>
