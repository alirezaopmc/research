{% if not q or not q.strip() %}
  <p class="search-hint">Start typing to search the vault.</p>
{% elif not hits %}
  <p class="search-hint">No matches for “{{ q }}”.</p>
{% else %}
  <ul class="search-hits">
    {% for h in hits %}
      <li>
        <a
          href="/viewer/note/{{ h.path | quote_path }}"
          hx-get="/viewer/note/{{ h.path | quote_path }}"
          hx-target="#doc-layout"
          hx-swap="outerHTML"
          hx-push-url="true"
        >{{ h.path }}</a>
        <span class="snippet">{{ h.snippet }}</span>
      </li>
    {% endfor %}
  </ul>
{% endif %}
