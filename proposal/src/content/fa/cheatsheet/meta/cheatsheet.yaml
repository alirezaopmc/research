title: "چیت‌شیت پروپوزال"
subtitle: "بررسی بازنمایی‌های درونی برای فهم و ارزیابی رفتار مدل‌های زبانی بزرگ"
identity:
  - "علیرضا جعفرتاش · کارشناسی ارشد (نوبت دوم) · مهندسی کامپیوتر، الگوریتم‌ها و محاسبات · کاربردی · ۱۲ ماه"
  - "استاد راهنما: دکتر روح اله عابدیان · استاد مشاور: دکتر علی فهیم · دانشکده علوم مهندسی، دانشگاه تهران"
idea: >-
  پژوهشی اکتشافی درباره‌ی رابطه‌ی بازنمایی‌های درونی و رفتار مشاهده‌پذیر مدل‌های زبانی بزرگ. تعهد: بررسی بازنمایی‌های درونی برای فهم و ارزیابی رفتار. باز: اینکه سهم نهایی روش تحلیل، رویکرد ارزیابی، مدل پیش‌بینی یا آزمایش مداخله باشد. مطالعه‌ی موردی آغازین: خطای واقعیتی در پرسش‌وپاسخ دانش‌محور.
questions:
  - "پرسش ۱: بازنمایی‌های درونی چگونه می‌توانند برای بررسی و فهم رفتار مدل‌های زبانی بزرگ به کار روند؟"
  - "پرسش ۲: بازنمایی‌های درونی تا چه اندازه اطلاعات سودمندی برای ارزیابی یا پیش‌بینی رفتار فراهم می‌کنند، فراتر از ارزیابی مبتنی بر خروجی؟"
  - "پرسش ۳: آیا می‌توان از راه بازنمایی‌ها بر رفتار مدل اثر گذاشت و چه محدودیت‌ها و موازنه‌هایی پدید می‌آید؟"
why:
  - "ارزیابی بیرونی رفتار کم‌هزینه است اما سازوکار درونی را توضیح نمی‌دهد. تفسیر مکانیکی شواهد علّی موضعی می‌دهد، ولی به‌تنهایی کافی نیست. ارزیابی کم‌هزینه‌ی مدل‌های وزن‌باز پیش از به‌کارگیری در سامانه‌های حساس ارزش عملی دارد."
  - "شکاف: روشن نیست بازنمایی‌ها چه اطلاعاتی فراتر از خروجی می‌دهند، خودرمزنگارهای تنک در برابر خط‌مبناهای ساده چه سودی دارند (AxBench، Kantamneni)، و یافته‌ها تا چه اندازه تعمیم می‌یابند. نوآوری قطعی پس از مرور نظام‌مند پیشینه تعیین می‌شود."
method:
  - label: "مراحل"
    text: "مرور و پالایش پرسش‌ها، آماده‌سازی آزمایش، تحلیل بازنمایی، بررسی کاربرد، ارزیابی و تحلیل، نگارش. یک کاربرد اصلی و حداکثر یک کاربرد فرعی."
  - label: "مدل و منابع"
    text: "یک یا چند مدل وزن‌باز بر پایه‌ی دسترسی به فعال‌سازی‌ها، نیاز محاسباتی و منابع پشتیبان. نامزد اولیه: Gemma 2 2B با Gemma Scope روی گوگل کولب پرو (T4). گسترش‌های پرهزینه به نتایج مقدماتی وابسته‌اند."
  - label: "روش‌های نامزد"
    text: "تحلیل حالت‌های پنهان، پروب خطی و دیگر پروب‌ها، تحلیل ویژگی، خودرمزنگار تنک. اجرای همه الزامی نیست."
  - label: "کاربردها"
    text: "فهم رفتار، ارزیابی یا پیش‌بینی رفتار، و مداخله (اکتشافی و مشروط به شواهد). تشخیص خطای واقعیتی نمونه‌ی دو کاربرد نخست."
  - label: "داده"
    text: "بر پایه‌ی ارتباط با پرسش‌ها و معیار ارزیابی قابل‌اعتماد. نامزدها برای پرسش‌وپاسخ دانش‌محور: TriviaQA، NQ-Open، PopQA، TruthfulQA."
  - label: "ارزیابی"
    text: "سنجه‌ها متناسب با وظیفه‌ی منتخب: کارایی پیش‌بینی یا طبقه‌بندی، استحکام، تعمیم، هزینه‌ی محاسباتی، و اثرهای جانبی مداخله. مقایسه با رویکردهای مبتنی بر خروجی و بازنمایی در صورت تناسب."
phases:
  - months: "۱ تا ۳"
    label: "مرحله ۱"
    work: "مرور پیشینه در پنج محور و پالایش پرسش‌ها"
    output: "گزارش مرور، پرسش‌های پالایش‌شده و کاربرد اصلی"
  - months: "۳ تا ۴"
    label: "مرحله ۲"
    work: "انتخاب مدل، وظیفه، داده و روش‌های تحلیل"
    output: "تعریف رفتار هدف، معیارها و طرح مقایسه"
  - months: "۴ تا ۶"
    label: "مرحله ۳"
    work: "تحلیل بازنمایی‌ها و رابطه‌ی آن‌ها با رفتار"
    output: "خط لوله‌ی بازتولیدپذیر و نتایج تحلیل"
  - months: "۶ تا ۹"
    label: "مرحله ۴"
    work: "بررسی کاربرد منتخب و مقایسه با رویکردهای موجود"
    output: "نتایج کاربرد منتخب"
  - months: "۹ تا ۱۱"
    label: "مرحله ۵"
    work: "ارزیابی پایایی، سودمندی، محدودیت‌ها و هزینه"
    output: "گزارش ارزیابی یا نتیجه‌ی منفی"
  - months: "۱۱ تا ۱۲"
    label: "مرحله ۶"
    work: "تفسیر یافته‌ها و نگارش"
    output: "پیش‌نویس پایان‌نامه، مقاله و دفاع"
risks:
  - "دامنه‌ی باز می‌تواند پراکنده شود؛ مرز: رابطه‌ی بازنمایی و رفتار در مدل‌ها و وظایف منتخب، با یک کاربرد اصلی."
  - "خودرمزنگارها در هدایت و تشخیص مفهوم اغلب از خط‌مبناهای ساده عقب‌اند؛ میانگین تفاضلی قوی است (AxBench، Kantamneni)."
  - "آشکارسازهای مبتنی بر بازنمایی در تعمیم خارج از توزیع ضعیف گزارش شده‌اند (Dubanowska و همکاران، ۲۰۲۵)."
  - "مداخله اکتشافی است؛ نتیجه‌ی منفی هم گزارش می‌شود."
  - "نوآوری پس از مرور نظام‌مند پیشینه و آزمایش‌های مقدماتی تعیین می‌شود."
terms:
  - term: "خودرمزنگار تنک"
    def: "شبکه‌ای که فعال‌سازی یک لایه را به ویژگی‌های تنک تجزیه و بازسازی می‌کند؛ در هر ورودی تعداد کمی از آن‌ها فعال‌اند."
  - term: "ویژگی"
    def: "جزء قابل‌تفسیر بازنمایی که با جهت یا الگوی مشخص در فعال‌سازی‌ها متناظر است."
  - term: "فعال‌سازی"
    def: "مقادیر عددی یک لایه برای یک ورودی مشخص است."
  - term: "پروب خطی"
    def: "پروب خطی، طبقه‌بند خطی روی بازنمایی ثابت است؛ وزن‌های مدل اصلی تغییر نمی‌کنند."
  - term: "آنتروپی معنایی"
    def: "آنتروپی معنایی، ناپایداری پاسخ است که بر پایه‌ی خوشه‌بندی پاسخ‌های نمونه‌گرفته‌شده بر اساس هم‌معنایی سنجیده می‌شود."
  - term: "میانگین تفاضلی"
    def: "میانگین تفاضلی، بردار جهتی است که از تفاضل میانگین فعال‌سازی دو گروه ساخته می‌شود؛ خط‌مبنای قوی برای تشخیص و هدایت است."
  - term: "کالیبراسیون"
    def: "کالیبراسیون، میزان همخوانی اطمینان اعلام‌شده با نرخ واقعی درستی پاسخ‌هاست."
  - term: "پاسخ‌گویی انتخابی"
    def: "پاسخ‌گویی انتخابی، رفتاری است که در آن مدل وقتی اطمینان کافی ندارد از پاسخ خودداری می‌کند؛ موازنه‌ی آن میان دقت و پوشش سنجیده می‌شود."
  - term: "خارج از توزیع"
    def: "داده‌ای است که با آموزش یا ارزیابی اصلی تفاوت سیستماتیک دارد؛ سنجش تعمیم را ممکن می‌کند."
  - term: "هدایت بازنمایی"
    def: "هدایت بازنمایی، تغییر هدفمند پاسخ از راه ورودی، تولید یا بازنمایی درونی است؛ افت‌های جانبی هم سنجیده می‌شوند."
