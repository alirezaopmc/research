note: "ماه ۱ معادل آبان ۱۴۰۵ و ماه ۱۲ معادل مهر ۱۴۰۶ است. مراحل با شش مرحله‌ی روش اجرا (\u2066۴-۲\u2069) متناظرند و سهم تقریبی آن‌ها از کل پروژه به ترتیب حدود ۲۰، ۱۵، ۲۰، ۲۰، ۱۵ و ۱۰ درصد است. این نسبت‌ها برای برنامه‌ریزی‌اند و موعد قطعی نیستند. مراحل هم‌پوشانی کوتاهی دارند و مستندسازی یافته‌ها در طول پروژه ادامه دارد. گام‌های شکل ۳ به مراحل نگاشته می‌شوند: گام ۱ مراحل اول و دوم، گام ۲ مراحل سوم و چهارم، و گام ۳ مراحل پنجم و ششم."
milestones:
  - phase: مرحله اول
    output: "گزارش مرور پیشینه در پنج محور، پرسش‌های پالایش‌شده و کاربرد اصلی منتخب"
  - phase: مرحله دوم
    output: "انتخاب مدل، وظیفه، داده و روش‌های تحلیل، و ثبت تعریف رفتار هدف، معیارها و طرح مقایسه"
  - phase: مرحله سوم
    output: "خط لوله‌ی بازتولیدپذیر و نتایج تحلیل رابطه‌ی بازنمایی‌ها با رفتارهای منتخب"
  - phase: مرحله چهارم
    output: "نتایج کاربرد منتخب (ارزیابی، پیش‌بینی، طبقه‌بندی یا مداخله) و مقایسه با رویکردهای موجود"
  - phase: مرحله پنجم
    output: "ارزیابی پایایی، سودمندی، محدودیت‌ها و هزینه‌ی محاسباتی، یا گزارش نتیجه‌ی منفی"
  - phase: مرحله ششم
    output: "پیش‌نویس پایان‌نامه، مقاله‌ی علمی و جلسه‌ی دفاع"
