definition:
  segments:
    - text: "مدل‌های زبانی بزرگ"
      en: "large language models (LLMs)"
    - text: " در تولید متن روان و به‌ظاهر معتبر توانمندند، اما پاسخ آن‌ها ممکن است با تغییر وظیفه و "
    - text: "زمینه"
      en: "context"
    - text: " یا صورت‌بندی ورودی تغییر کند و نادرست، "
    - text: "سوگیرانه"
      en: "bias"
    - text: " یا ناسازگار باشد. مطالعه‌ی این تغییرات می‌تواند به شناخت بهتر "
    - text: "قابلیت‌ها"
      en: "capabilities"
    - text: " و محدودیت‌های مدل‌ها و بررسی راه‌های ارزیابی و بهبود آن‌ها کمک کند."
  paragraphs:
    - segments:
        - text: "از دید فنی، مدل زبانی بزرگ متن را به "
        - text: "توکن‌ها"
          en: "token"
        - text: " "
        - text: "تبدیل می‌کند و برای پیش‌بینی توکن بعدی، بازنمایی آن‌ها را از چندین لایهٔ "
        - text: "ترانسفورمر"
          en: "transformer"
        - text: " می‌گذراند؛ این لایه‌ها معمولاً "
        - text: "سازوکار توجه"
          en: "attention mechanism"
        - text: " و "
        - text: "شبکه‌های پیش‌خور"
          en: "feed-forward networks"
        - text: " دارند و با "
        - text: "وزن‌های آموخته‌شده"
          en: "learned weights"
        - text: "، "
        - text: "ویژگی‌های میانی"
          en: "intermediate features"
        - text: " و "
        - text: "فعال‌سازی‌های"
          en: "activations"
        - text: " وابسته به ورودی را محاسبه می‌کنند. بنابراین، بررسی درونی مدل می‌تواند وزن‌ها و اجزای لایه‌ها، و نیز بازنمایی‌ها و "
        - text: "مسیرهای محاسباتیِ"
          en: "computational paths"
        - text: " دخیل در شکل‌گیری پاسخ را دربرگیرد؛ برای نمونه، می‌توان بازنمایی یک لایه را تغییر داد و اثر آن را بر پاسخ سنجید. در این نگاه، موضوع فقط وزن‌ها یا "
        - text: "نورون‌های منفرد"
          en: "neurons"
        - text: " نیست، بلکه چگونگی مشارکت این اجزا در پردازش است [۱–۲]."
key-concepts:
  - term-fa: مدل زبانی بزرگ
    term-en: large language model (LLM)
    term-en-footnote: false
    definition:
      segments:
        - text: "مدل زبانی بزرگ، "
        - text: "شبکه‌ای عصبی"
          en: "neural network"
        - text: " با "
        - text: "پارامترهای"
          en: "parameters"
        - text: " آموخته‌شده از داده‌های متنی است. در بسیاری از "
        - text: "مدل‌های مولد"
          en: "generative models"
        - text: " رایج، متن ورودی به توکن‌ها تبدیل و با لایه‌های ترانسفورمر پردازش می‌شود؛ مدل با توجه به توکن‌های پیشین، "
        - text: "توزیع احتمال"
          en: "probability distribution"
        - text: " توکن بعدی را برآورد می‌کند و وزن‌ها این محاسبه را پارامتردهی می‌کنند. این "
        - text: "معماری"
          en: "architecture"
        - text: " مبنای بررسی رابطهٔ میان ورودی، محاسبات درونی و پاسخ تولیدشده در این پژوهش است [۱–۲]."
  - term-fa: توکن
    term-en: token
    term-en-footnote: false
    definition: "واحدی است که متن در فرایند پردازش به آن تبدیل می‌شود؛ ممکن است واژهٔ کامل، بخشی از واژه، عدد یا نشانهٔ نگارشی باشد."
  - term-fa: رفتار مدل
    term-en: model behavior
    definition:
      segments:
        - text: "به خروجی قابل مشاهدهٔ مدل برای یک وظیفه و مجموعه‌ای از شرایط ورودی گفته می‌شود؛ این خروجی می‌تواند متن پاسخ، "
        - text: "امتناع"
          en: "refusal"
        - text: "، انتخاب یا نمرهٔ یک گزینه باشد. در این پژوهش، رفتار با تغییر کنترل‌شدهٔ "
        - text: "دستور"
          en: "prompt"
        - text: " یا زمینه مقایسه می‌شود؛ خودِ پاسخ به‌تنهایی سازوکار درونیِ تولید آن را نشان نمی‌دهد [۳–۴]."
  - term-fa: خطای واقعیتی
    term-en: factual error
    definition:
      segments:
        - text: "پاسخی که با پاسخ طلایی یا واقعیت شناخته‌شده سازگار نیست. این پژوهش خطا را بر پایه‌ی پایداری پاسخ‌ها در نمونه‌گیری مکرر به دو کلاس تقسیم می‌کند: «خطای سازگار»، که پاسخ نادرست تکرار می‌شود، و «خطای ناسازگار»، که پاسخ‌ها پراکنده‌اند. «ندانستن» تعبیر عملیاتی خطای ناسازگار است و با فقدان دانش در پارامترهای مدل یکی نیست؛ تفکیک این دو نیازمند معیار درستی روشن است [۵–۶]."
  - term-fa: زمینه
    term-en: context
    term-en-footnote: false
    definition:
      segments:
        - text: "اطلاعاتی است که هنگام تولید پاسخ در "
        - text: "پنجرهٔ ورودی"
          en: "context window"
        - text: " مدل قرار می‌گیرد، از جمله دستور سیستم، پرسش کاربر، "
        - text: "تاریخچهٔ گفتگو"
          en: "conversation history"
        - text: " و "
        - text: "مثال‌های ارائه‌شده"
          en: "in-context examples"
        - text: ". با ثابت نگه‌داشتن وظیفه و تغییر یک جزء از این اطلاعات، می‌توان سنجید کدام بخش از زمینه پاسخ یا رفتار مدل را تغییر می‌دهد."
  - term-fa: سوگیری
    term-en: bias
    term-en-footnote: false
    definition:
      segments:
        - text: "الگوی پایدار تفاوت در محتوا، کیفیت یا نرخ پاسخ‌های مدل است که هنگامی که گروه‌ها یا صورت‌بندی‌های معادل یک پرسش با شرایط یکسان مقایسه می‌شوند، آشکار می‌شود. برای سنجش آن، می‌توان اختلاف نرخ یک نوع پاسخ یا امتیاز متوسط را میان گروه‌ها محاسبه کرد. با این حال، یک تفاوت آماری به‌تنهایی نه ناعادلانه بودن پاسخ‌ها را ثابت می‌کند و نه علت درونی مشخصی را نشان می‌دهد؛ برای این کار باید "
        - text: "متغیرهای مزاحم"
          en: "confounding variables"
        - text: " کنترل شوند [۳، ۷]."
  - term-fa: پایداری رفتار
    term-en: behavioral robustness
    definition:
      segments:
        - text: "میزان حفظ عملکرد یا پاسخ مورد انتظار در برابر تغییرهایی است که نباید معنای وظیفه را عوض کنند؛ مانند بازنویسی پرسش، جابه‌جایی ترتیب اطلاعات یا تغییر جزئی دستور. برای سنجش آن، می‌توان "
        - text: "دقت"
          en: "accuracy"
        - text: "، سازگاری پاسخ‌ها یا تغییر "
        - text: "توزیع خروجی"
          en: "output distribution"
        - text: " را میان نسخه‌های کنترل‌شدهٔ یک ورودی مقایسه کرد؛ لزومی به یکسانی کامل متن پاسخ‌ها نیست [۳]."
  - term-fa: قابلیت تفسیر مکانیکی
    term-en: mechanistic interpretability
    definition:
      segments:
        - text: "رویکردی برای ساخت و آزمودن توضیح‌های فنی دربارهٔ چگونگی محاسبهٔ پاسخ درون شبکه است. پژوهشگر بازنمایی‌ها و فعال‌سازی‌های لایه‌ها، "
        - text: "سرهای توجه"
          en: "attention heads"
        - text: "، شبکه‌های پیش‌خور یا وزن‌ها را تحلیل می‌کند و با "
        - text: "مداخله"
          en: "intervention"
        - text: "—مثلاً جایگزینی یک فعال‌سازی و سنجش تغییر پاسخ—نقش علّیِ پیشنهادی را می‌آزماید؛ در این رویکرد، فرضیه‌ی یک‌به‌یک میان نورون و مفهوم کنار گذاشته می‌شود و نقش شبکه‌ای بازنمایی‌ها سنجیده می‌شود [۲، ۸–۹]."
  - term-fa: خودرمزنگار تنک
    term-en: sparse autoencoder (SAE)
    definition:
      segments:
        - text: "شبکه‌ای که فعال‌سازی‌های یک لایه‌ی مدل را به مجموعه‌ای بزرگ از ویژگی‌های تنک، یعنی با تعداد کمی ویژگی فعال در هر ورودی، تجزیه و بازسازی می‌کند. هدف آن جداسازی مفاهیمی است که در یک بازنمایی با هم ترکیب شده‌اند [۱۰–۱۲]."
  - term-fa: پروب خطی
    term-en: linear probe
    definition:
      segments:
        - text: "یک مدل خطی ساده که روی بازنمایی‌های یک لایه‌ی ثابت مدل آموزش داده می‌شود تا یک ویژگی معین، مانند درستی گزاره، را از آن پیش‌بینی کند. وزن‌های مدل اصلی تغییر نمی‌کنند؛ پروب فقط نشان می‌دهد که آن ویژگی با یک تابع خطی از بازنمایی قابل خواندن است یا نه [۱۳]."
  - term-fa: هدایت مدل
    term-en: model steering
    definition:
      segments:
        - text: "تغییر هدفمند در خروجی یا احتمال پاسخ‌های مدل است که با روش‌هایی مانند بازنویسی دستور، تنظیم فرایند تولید یا تغییر "
        - text: "بازنمایی‌های درونی"
          en: "internal representations"
        - text: " هنگام اجرا ایجاد می‌شود. هدایت را با سنجش تغییر رفتار هدف و بررسی "
        - text: "افت‌های جانبی"
          en: "side effects"
        - text: "—مانند کاهش دقت یا "
        - text: "تعمیم‌پذیری"
          en: "generalization"
        - text: "—ارزیابی می‌کنند؛ بنابراین، تغییر پاسخ به‌تنهایی نشانهٔ هدایت موفق و قابل‌اعتماد نیست [۱۴–۱۶]."
goal:
  paragraphs:
    - segments:
        - text: "هدف کلی این پژوهش، بررسی رفتار مدل‌های زبانی بزرگ در موقعیت‌های گوناگون و شناسایی راه‌های ممکن برای فهم، ارزیابی و هدایت آن‌هاست. برای آزمودن عملی این هدف، پژوهش «خطای واقعیتی» در پرسش‌وپاسخ دانش‌محور را به‌عنوان مطالعه‌ی موردی برمی‌گزیند، زیرا معیار درستی آن روشن است و امکان مقایسه‌ی منصفانه با خط‌مبناها را فراهم می‌کند. این مطالعه‌ی موردی نشان می‌دهد ابزارهای تفسیر درونی تا چه اندازه می‌توانند به ارزیابی رفتار مدل کمک کنند."
    - segments:
        - text: "جنبه‌ی نوآوری پژوهش: نوآوری این پژوهش در ارائه‌ی نخستین مقایسه‌ی کنترل‌شده، از پیش ثبت‌شده و هم‌زمان میان ویژگی‌های خودرمزنگارهای تنک، پروب خطی روی بازنمایی خام، پروب آنتروپی معنایی و میانگین تفاضلی برای تفکیک خطای سازگار از خطای ناسازگار است. این ارزیابی در شرایط آزمون خارج از توزیع و با رعایت سقف بودجه‌ی محاسباتی در دسترس طراحی شده است و نتیجه‌ی تهی را نیز یافته‌ای علمی و معتبر تلقی می‌کند."
necessity:
  paragraphs:
    - segments:
        - text: "ارزیابی رفتاری"
          en: "behavioral evaluation"
        - text: " [۳–۴، ۷] نشان می‌دهد مدل در چه شرایطی چه پاسخی می‌دهد، اما به‌تنهایی روشن نمی‌کند این پاسخ در درون مدل چگونه تولید شده است. در راستای پر کردن این فاصله، پژوهش‌های قابلیت تفسیر مکانیکی، "
        - text: "بازنمایی‌های درونی"
        - text: " و "
        - text: "مدارهای محاسباتی"
          en: "computational circuits"
        - text: " را بررسی می‌کنند [۲، ۸–۹، ۱۷–۱۸]. بعضی روش‌ها برای یک ورودی مشخص، "
        - text: "گراف محاسباتی"
          en: "prompt-specific computational graph"
        - text: " وابسته به همان ورودی می‌سازند؛ سپس با "
        - text: "مداخله‌ی علّی"
          en: "causal intervention"
        - text: "، مثلاً تغییر یک مؤلفه‌ی درونی و سنجش اثر آن بر پاسخ، فرضیه را می‌آزمایند [۸–۹]."
    - segments:
        - text: "رفتارهایی مانند امتناع و تولید اطلاعات نادرست، با آزمون بیرونی تنها تا حدی سنجیده می‌شوند؛ تفسیر مکانیکی می‌تواند توضیح دهد که چرا یک پاسخ تولید شده است. نمونه‌ی منتشرشده‌ی شکل ۲ نشان می‌دهد که جایگزینی ویژگی میانیِ «تگزاس» با «کالیفرنیا» پاسخ مدل را از «آستین» به «ساکرامنتو» تغییر می‌دهد؛ اما "
        - text: "شواهد علّی موضعی"
          en: "localized causal evidence"
        - text: " به‌تنهایی توضیح کاملی از رفتار مدل نیستند [۸–۹]. از نظر کاربردی، ارزیابی کم‌هزینه‌ی رفتار مدل‌های متن‌باز پیش از به‌کارگیری در سامانه‌های حساس ارزش عملی دارد. بنابراین، ارزیابی رفتار و سنجش مستقل تفسیرها هر دو لازم‌اند؛ پیشینه‌ی این بحث در \u2066۴-۳\u2069 و امکان‌سنجی آن در \u2066۴-۲\u2069 آمده است."
research-questions:
  - "آیا ویژگی‌های خودرمزنگارهای تنک از لایه‌های میانی مدل‌های متن‌باز، «خطای سازگار» را از «خطای ناسازگار» بهتر از خط‌مبناهای قوی—پروب خطی روی بازنمایی خام، پروب آنتروپی معنایی و میانگین تفاضلی—تفکیک می‌کنند؟ فرضیه‌ی آزمون، برتری آماری معنادار ویژگی‌های خودرمزنگار نسبت به بهترین خط‌مبنا در هر دو مجموعه‌داده‌ی آموزش و خارج از توزیع است؛ فرض صفر نبود چنین تفاوتی است و نتیجه‌ی تهی، در صورت وقوع، یافته‌ای معتبر خواهد بود."
  - segments:
      - text: "آیا یک "
      - text: "طبقه‌بند"
        en: "classifier"
      - text: " ساده روی فعال‌سازی‌های تنک، پیش از تولید پاسخ، خطای واقعیتی را با AUROC بالاتر از ۰.۷۰ در مجموعه‌داده‌ی آموزش شناسایی می‌کند، و این عملکرد در مجموعه‌داده‌های خارج از توزیع آموزش حفظ می‌شود (با افت کمتر از ۰.۰۵)؟"
  - segments:
      - text: "در صورت کفایت شواهد پرسش‌های پیشین، موازنه‌ی دقت و پوشش در پاسخ‌گویی انتخابی با آستانه‌ی کالیبره‌شده‌ی طبقه‌بند چیست، و هدایت ویژگی‌ها نسبت به خط‌مبنای دستور و "
      - text: "میانگین تفاضلی"
        en: "difference-in-means"
      - text: " چه اثری بر خطای واقعیتی و کیفیت سایر پاسخ‌ها دارد؟"