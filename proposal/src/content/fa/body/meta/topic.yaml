definition:
  segments:
    - text: "مدل‌های زبانی بزرگ"
      en: "Large Language Models (LLMs)"
    - text: " در تولید متن روان و ظاهراً معتبر بسیار توانمندند، اما گاه فاقد آگاهی قابل اتکا از مرز دانش درونی خود هستند و پاسخ‌هایی نادرست یا ساختگی ارائه می‌دهند که در ادبیات به "
    - text: "«توهم»"
      en: "Hallucination"
    - text: " شناخته می‌شود. این پژوهش بر آن است تا با تکیه بر "
    - text: "تفسیرپذیری مکانیکی"
      en: "Mechanistic Interpretability"
    - text: " و استخراج ویژگی‌های پراکنده از فضای فعال‌سازی‌های میانی مدل، سیگنال‌های مرتبط با آگاهی از دانش را شناسایی و برای تشخیص و کاهش توهم به کار گیرد."
goal:
  segments:
    - text: "هدف اصلی، طراحی و ارزیابی چارچوبی است که بتواند از ویژگی‌های "
    - text: "خودرمزنگار پراکنده"
      en: "Sparse Autoencoders (SAEs)"
    - text: " برای نمایش حالت‌های درونی مرتبط با تسلط مدل بر دانش استفاده کند، آستانه‌های قابل تفسیر برای تشخیص توهم پیشنهاد دهد، و در صورت امکان مکانیزم‌های سبک کاهش خطا را پیش از تولید پاسخ نهایی فعال سازد."
necessity:
  segments:
    - text: "با گسترش کاربرد مدل‌های زبانی بزرگ در حوزه‌های حساس، هزینه خطاهای ظاهراً محترمانه اما نادرست به‌سرعت بالا می‌رود. روش‌های مبتنی تنها بر خروجی نهایی، علت توهم را توضیح نمی‌دهند. تفسیرپذیری با خودرمزنگار پراکنده امکان اتصال رفتار مدل به واحدهای معنایی قابل ردیابی را فراهم می‌کند و با بودجه محاسباتی محدود (Colab / یک GPU) قابل دسترس است."
research-questions:
  segments:
    - text: "۱) کدام ویژگی‌های خودرمزنگار پراکنده با خطای "
    - text: "حقایقی"
      en: "Factual Error"
    - text: " یا توهم در وظایف دانشی همبستگی دارند؟ ۲) آیا می‌توان از این ویژگی‌ها برای تشخیص زودهنگام پاسخ پرخطر استفاده کرد؟ ۳) کدام راهبردهای مداخله سبک (بازنویسی پرامپت، فیلتر ویژگی، یا "
    - text: "امتناع از پاسخ"
      en: "Abstention"
    - text: ") بیشترین کاهش توهم را با کمترین افت کیفیت ایجاد می‌کنند؟"
