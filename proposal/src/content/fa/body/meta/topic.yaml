definition:
  segments:
    - text: "مدل‌های زبانی بزرگ"
      en: "large language models (LLMs)"
    - text: " در تولید متن روان و ظاهراً معتبر توانمند هستند، اما پاسخ آن‌ها می‌تواند با تغییر وظیفه و "
    - text: "زمینه"
      en: "context"
    - text: " یا صورت‌بندی ورودی تغییر کند و گاهی نادرست، "
    - text: "سوگیرانه"
      en: "bias"
    - text: " یا ناسازگار باشد. مطالعه‌ی این تغییرات می‌تواند به شناخت بهتر "
    - text: "قابلیت‌ها"
      en: "capabilities"
    - text: " و محدودیت‌های مدل‌ها و بررسی راه‌های ارزیابی و بهبود آن‌ها کمک کند."
  paragraphs:
    - segments:
        - text: "از دید فنی، مدل زبانی بزرگ متن را به "
        - text: "توکن‌ها"
          en: "token"
        - text: " "
        - text: "تبدیل می‌کند و برای پیش‌بینی توکن بعدی، بازنمایی آن‌ها را از چندین لایهٔ "
        - text: "ترانسفورمر"
          en: "transformer"
        - text: " می‌گذراند؛ این لایه‌ها معمولاً "
        - text: "سازوکار توجه"
          en: "attention mechanism"
        - text: " و "
        - text: "شبکه‌های پیش‌خور"
          en: "feed-forward networks"
        - text: " دارند و با "
        - text: "وزن‌های آموخته‌شده"
          en: "learned weights"
        - text: "، "
        - text: "ویژگی‌های میانی"
          en: "intermediate features"
        - text: " و "
        - text: "فعال‌سازی‌های"
          en: "activations"
        - text: " وابسته به ورودی را محاسبه می‌کنند. بنابراین، بررسی درونی مدل می‌تواند وزن‌ها و اجزای لایه‌ها، و نیز بازنمایی‌ها و "
        - text: "مسیرهای محاسباتیِ"
          en: "computational paths"
        - text: " دخیل در شکل‌گیری پاسخ را دربرگیرد؛ برای نمونه، می‌توان بازنمایی یک لایه را تغییر داد و اثر آن را بر پاسخ سنجید. در این نگاه، موضوع فقط وزن‌ها یا "
        - text: "نورون‌های منفرد"
          en: "neurons"
        - text: " نیست، بلکه چگونگی مشارکت این اجزا در پردازش است [۱۲–۱۳]."
key-concepts:
  - term-fa: مدل زبانی بزرگ
    term-en: large language model (LLM)
    term-en-footnote: false
    definition:
      segments:
        - text: "مدل زبانی بزرگ "
        - text: "شبکه‌ای عصبی"
          en: "neural network"
        - text: " با "
        - text: "پارامترهای"
          en: "parameters"
        - text: " آموخته‌شده از داده‌های متنی است. در بسیاری از "
        - text: "مدل‌های مولد"
          en: "generative models"
        - text: " رایج، متن ورودی به توکن‌ها تبدیل و با لایه‌های ترانسفورمر پردازش می‌شود؛ مدل با توجه به توکن‌های پیشین، "
        - text: "توزیع احتمال"
          en: "probability distribution"
        - text: " توکن بعدی را برآورد می‌کند و وزن‌ها این محاسبه را پارامتردهی می‌کنند. این "
        - text: "معماری"
          en: "architecture"
        - text: " مبنای بررسی رابطهٔ میان ورودی، محاسبات درونی و پاسخ تولیدشده در این پژوهش است [۶، ۱۲]."
  - term-fa: توکن
    term-en: token
    term-en-footnote: false
    definition: "واحدی است که متن در فرایند پردازش به آن تبدیل می‌شود؛ ممکن است واژهٔ کامل، بخشی از واژه، عدد یا نشانهٔ نگارشی باشد."
  - term-fa: رفتار مدل
    term-en: model behavior
    definition:
      segments:
        - text: "به خروجی قابل مشاهدهٔ مدل برای یک وظیفه و مجموعه‌ای از شرایط ورودی گفته می‌شود؛ این خروجی می‌تواند متن پاسخ، "
        - text: "امتناع"
          en: "refusal"
        - text: "، انتخاب یا نمرهٔ یک گزینه باشد. در این پژوهش، رفتار با تغییر کنترل‌شدهٔ "
        - text: "دستور"
          en: "prompt"
        - text: " یا زمینه مقایسه می‌شود؛ خودِ پاسخ به‌تنهایی سازوکار درونیِ تولید آن را نشان نمی‌دهد [۱–۲]."
  - term-fa: خطای واقعیتی
    term-en: factual error
    definition:
      segments:
        - text: "پاسخی که با پاسخ طلایی یا واقعیت شناخته‌شده سازگار نیست. این خطا با «ندانستن» متفاوت است: در «ندانستن» مدل پاسخ معتبری ندارد و امتناع یا تردید نشان می‌دهد، اما در خطای واقعیتی پاسخ نادرست تولید می‌شود. تفکیک این دو نیازمند معیار درستی روشن است [۱۴، ۱۸]."
  - term-fa: زمینه
    term-en: context
    term-en-footnote: false
    definition:
      segments:
        - text: "اطلاعاتی است که هنگام تولید پاسخ در "
        - text: "پنجرهٔ ورودی"
          en: "context window"
        - text: " مدل قرار می‌گیرد، از جمله دستور سیستم، پرسش کاربر، "
        - text: "تاریخچهٔ گفتگو"
          en: "conversation history"
        - text: " و "
        - text: "مثال‌های ارائه‌شده"
          en: "in-context examples"
        - text: ". با ثابت نگه‌داشتن وظیفه و تغییر یک جزء از این اطلاعات می‌توان سنجید کدام بخش از زمینه پاسخ یا رفتار مدل را تغییر می‌دهد [۲]."
  - term-fa: سوگیری
    term-en: bias
    term-en-footnote: false
    definition:
      segments:
        - text: "الگوی پایدار تفاوت در محتوا، کیفیت یا نرخ پاسخ‌های مدل است که وقتی گروه‌ها یا صورت‌بندی‌های معادل یک پرسش با شرایط یکسان مقایسه می‌شوند، آشکار می‌شود. برای سنجش آن، می‌توان اختلاف نرخ یک نوع پاسخ یا امتیاز متوسط را میان گروه‌ها محاسبه کرد. با این حال، یک تفاوت آماری به‌تنهایی نه ناعادلانه بودن پاسخ‌ها را ثابت می‌کند و نه علت درونی مشخصی را نشان می‌دهد؛ برای این کار باید "
        - text: "متغیرهای مزاحم"
          en: "confounding variables"
        - text: " کنترل شوند [۱، ۳]."
  - term-fa: پایداری رفتار
    term-en: behavioral robustness
    definition:
      segments:
        - text: "میزان حفظ عملکرد یا پاسخ مورد انتظار در برابر تغییرهایی است که نباید معنای وظیفه را عوض کنند؛ مانند بازنویسی پرسش، جابه‌جایی ترتیب اطلاعات یا تغییر جزئی دستور. برای سنجش آن، می‌توان "
        - text: "دقت"
          en: "accuracy"
        - text: "، سازگاری پاسخ‌ها یا تغییر "
        - text: "توزیع خروجی"
          en: "output distribution"
        - text: " را میان نسخه‌های کنترل‌شدهٔ یک ورودی مقایسه کرد؛ لازم نیست متن پاسخ‌ها عیناً یکسان باشد [۱]."
  - term-fa: قابلیت تفسیر مکانیکی
    term-en: mechanistic interpretability
    definition:
      segments:
        - text: "رویکردی برای ساخت و آزمودن توضیح‌های فنی دربارهٔ چگونگی محاسبهٔ پاسخ درون شبکه است. پژوهشگر بازنمایی‌ها و فعال‌سازی‌های لایه‌ها، "
        - text: "سرهای توجه"
          en: "attention heads"
        - text: "، شبکه‌های پیش‌خور یا وزن‌ها را تحلیل می‌کند و با "
        - text: "مداخله"
          en: "intervention"
        - text: "—مثلاً جایگزینی یک فعال‌سازی و سنجش تغییر پاسخ—نقش علّیِ پیشنهادی را می‌آزماید؛ یک نورون منفرد لزوماً معادل یک مفهوم نیست [۱۰–۱۱، ۱۳]."
  - term-fa: خودرمزنگار تنک
    term-en: sparse autoencoder (SAE)
    definition:
      segments:
        - text: "شبکه‌ای که فعال‌سازی‌های یک لایه‌ی مدل را به مجموعه‌ای بزرگ از ویژگی‌های تنک، یعنی با تعداد کمی ویژگی فعال در هر ورودی، تجزیه و بازسازی می‌کند. هدف آن جداسازی مفاهیمی است که در یک بازنمایی با هم ترکیب شده‌اند [۱۵، ۱۶]."
  - term-fa: هدایت مدل
    term-en: model steering
    definition:
      segments:
        - text: "تغییر هدفمند در خروجی یا احتمال پاسخ‌های مدل است که با روش‌هایی مانند بازنویسی دستور، تنظیم فرایند تولید یا تغییر "
        - text: "بازنمایی‌های درونی"
          en: "internal representations"
        - text: " هنگام اجرا ایجاد می‌شود. هدایت را با سنجش تغییر رفتار هدف و بررسی "
        - text: "افت‌های جانبی"
          en: "side effects"
        - text: "—مانند کاهش دقت یا "
        - text: "تعمیم‌پذیری"
          en: "generalization"
        - text: "—ارزیابی می‌کنند؛ بنابراین، تغییر پاسخ به‌تنهایی نشانهٔ هدایت موفق و قابل‌اعتماد نیست [۴، ۱۰]."
goal:
  text: "هدف کلی این پژوهش، بررسی رفتار مدل‌های زبانی بزرگ در موقعیت‌های گوناگون و شناسایی راه‌های ممکن برای فهم، ارزیابی و هدایت آن‌هاست. برای آزمودن عملی این هدف، پژوهش «خطای واقعیتی» در پرسش‌وپاسخ دانش‌محور را به‌عنوان مطالعه‌ی موردی برمی‌گزیند، زیرا معیار درستی آن روشن است و امکان مقایسه‌ی منصفانه با خط‌مبناها را فراهم می‌کند. این مطالعه‌ی موردی نشان می‌دهد ابزارهای تفسیر درونی تا چه اندازه می‌توانند به ارزیابی رفتار مدل کمک کنند."
necessity:
  paragraphs:
    - segments:
        - text: "ارزیابی رفتاری"
          en: "behavioral evaluation"
        - text: " [۱–۳] نشان می‌دهد مدل در چه شرایطی چه پاسخی می‌دهد، اما به‌تنهایی روشن نمی‌کند این پاسخ در درون مدل چگونه تولید شده است. پژوهش‌ها در قابلیت تفسیر مکانیکی برای پر کردن این فاصله، "
        - text: "بازنمایی‌های درونی"
        - text: " و "
        - text: "مدارهای محاسباتی"
          en: "computational circuits"
        - text: " را بررسی می‌کنند [۷–۸، ۱۰، ۱۳]. بعضی روش‌ها برای یک ورودی مشخص، "
        - text: "گراف محاسباتی"
          en: "prompt-specific computational graph"
        - text: " وابسته به همان ورودی می‌سازند؛ سپس با "
        - text: "مداخله‌ی علّی"
          en: "causal intervention"
        - text: "، مثلاً تغییر یک مؤلفه‌ی درونی و سنجش اثر آن بر پاسخ، فرضیه را می‌آزمایند [۹–۱۰]."
    - segments:
        - text: "رفتارهایی مانند امتناع و تولید اطلاعات نادرست، با آزمون بیرونی تنها تا حدی سنجیده می‌شوند؛ تفسیر مکانیکی می‌تواند توضیح دهد که چرا یک پاسخ تولید شده است. نمونه‌ی منتشرشده‌ی شکل ۲ نشان می‌دهد که جایگزینی ویژگی میانیِ «تگزاس» با «کالیفرنیا» پاسخ مدل را از «آستین» به «ساکرامنتو» تغییر می‌دهد؛ اما "
        - text: "شواهد علّی موضعی"
          en: "localized causal evidence"
        - text: " به‌تنهایی توضیح کاملی از رفتار مدل نیستند [۹–۱۱]. از نظر کاربردی، ارزیابی کم‌هزینه‌ی رفتار مدل‌های متن‌باز پیش از به‌کارگیری در سامانه‌های حساس ارزش عملی دارد. بنابراین، ارزیابی رفتار و سنجش مستقل تفسیرها هر دو لازم‌اند؛ پیشینه‌ی این بحث در ۴-۳ و امکان‌سنجی آن در ۴-۲ آمده است."
research-questions:
  - "آیا ویژگی‌های استخراج‌شده با خودرمزنگارهای تنک از لایه‌های میانی مدل‌های متن‌باز، «ندانستن» را از «خطای واقعیتی» بهتر از پروب‌های خطی روی بازنمایی خام تفکیک می‌کنند؟"
  - "آیا یک طبقه‌بند ساده روی فعال‌سازی‌های تنک، خطای واقعیتی را پیش از تولید توکن نهایی با دقت قابل قبول شناسایی می‌کند و این دقت در مجموعه‌داده‌های خارج از توزیع آموزش حفظ می‌شود؟"
  - "در صورت کفایت شواهد پرسش‌های پیشین، موازنه‌ی دقت و پوشش در امتناع کالیبره‌شده چیست و هدایت ویژگی‌ها چه اثری بر خطای واقعیتی و کیفیت سایر پاسخ‌ها دارد؟"