definition:
  segments:
    - text: "مدل‌های زبانی بزرگ"
      en: "Large Language Models (LLMs)"
    - text: " در تولید متن روان و ظاهراً معتبر بسیار توانمند هستند، اما رفتار آن‌ها در وظایف و موقعیت‌های گوناگون همیشه دقیق، پایدار یا متناسب با انتظار نیست. تفاوت در نوع وظیفه، زمینه و صورت‌بندی ورودی می‌تواند به پاسخ‌های نادرست، سوگیرانه، ناسازگار یا نامتناسب بینجامد. شناخت چگونگی بروز این رفتارها و عواملی که بر آن‌ها اثر می‌گذارند، گامی برای ارزیابی دقیق‌تر و بررسی راه‌های بهبود رفتار مدل‌هاست."
goal: >-
  هدف کلی این پژوهش، بررسی رفتار مدل‌های زبانی بزرگ در موقعیت‌های گوناگون
  و شناسایی راه‌های ممکن برای فهم، ارزیابی و هدایت آن‌هاست. پژوهش می‌کوشد
  روشن کند چه رفتارهایی در چه شرایطی بروز می‌کنند، چگونه می‌توان آن‌ها را
  به‌طور معتبر سنجید، و چه رویکردهایی می‌توانند پاسخ‌ها را به معیارهای
  مطلوب نزدیک‌تر کنند. رفتارهای مورد مطالعه، معیارهای ارزیابی و روش‌های
  مناسب پس از مرور پیشینه و بررسی امکان‌پذیری دقیق‌تر خواهند شد.
necessity: >-
  با گسترش استفاده از مدل‌های زبانی بزرگ در آموزش، پژوهش و خدمات، شناخت
  قابلیت‌ها و محدودیت‌های آن‌ها در موقعیت‌های متفاوت اهمیت روزافزونی دارد.
  رفتارهای ناخواسته، از جمله سوگیری، ناپایداری یا پاسخ نادرست، می‌توانند
  بر اعتمادپذیری و تناسب خروجی‌ها اثر بگذارند. بررسی نظام‌مند این رفتارها
  و واکنش مدل‌ها به شیوه‌های مختلف هدایت می‌تواند تصویری روشن‌تر از فرصت‌ها
  و محدودیت‌های این فناوری ارائه کند و مسیر پژوهش‌های متمرکزتر را مشخص سازد.
research-questions:
  segments:
    - text: "۱) رفتار مدل‌های زبانی بزرگ با تغییر وظیفه، زمینه و صورت‌بندی ورودی چگونه تغییر می‌کند؟ ۲) چه روش‌هایی برای توصیف و ارزیابی رفتارهای موردنظر، مانند سوگیری، ناپایداری یا پاسخ نادرست، مناسب‌اند؟ ۳) چه رویکردهایی می‌توانند رفتار مدل را به معیارهای مطلوب نزدیک‌تر کنند و این رویکردها چه اثری بر کیفیت و دامنه پاسخ‌ها دارند؟"
