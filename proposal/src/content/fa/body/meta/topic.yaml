definition: >-
  متن نمونه برای تعریف مسئله. این بخش به تشریح مسئله پژوهشی، زمینه
  نظری و محدوده مطالعه می‌پردازد.
goal: >-
  متن نمونه برای هدف. هدف اصلی این پژوهش ارائه راهکاری نوین برای
  بهبود کارایی الگوریتم‌های مورد مطالعه است.
necessity: >-
  متن نمونه برای ضرورت. انجام این پژوهش با توجه به نیازهای علمی و
  صنعتی موجود ضروری ارزیابی می‌شود.
research-questions: >-
  متن نمونه برای پرسش‌های پژوهش. پرسش اصلی: چگونه می‌توان
  کارایی محاسباتی را در شرایط محدودیت منابع بهبود داد؟
