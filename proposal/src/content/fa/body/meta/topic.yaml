definition:
  segments:
    - text: "مدل‌های زبانی بزرگ"
      en: "large language models (LLMs)"
    - text: " در وظایف و "
    - text: "زمینه‌های"
      en: "context"
    - text: " گوناگون رفتارهای پیچیده‌ای نشان می‌دهند. پاسخ آن‌ها ممکن است با تغییر وظیفه، زمینه یا صورت‌بندی ورودی تغییر کند و گاه نادرست، سوگیرانه یا ناسازگار باشد. خروجی این مدل‌ها را می‌توان از بیرون ارزیابی کرد، اما شناخت سازوکارها و "
    - text: "بازنمایی‌های درونی"
      en: "internal representations"
    - text: " مرتبط با این رفتارها همچنان مسئله‌ای پژوهشی و باز است."
  paragraphs:
    - segments:
        - text: "از دید فنی، مدل زبانی بزرگ متن را به "
        - text: "توکن‌ها"
          en: "token"
        - text: " تبدیل می‌کند و برای پیش‌بینی توکن بعدی، بازنمایی آن‌ها را از چندین "
        - text: "لایه‌ی ترانسفورمر"
          en: "transformer layers"
        - text: " می‌گذراند. این لایه‌ها معمولاً "
        - text: "سازوکار توجه"
          en: "attention mechanism"
        - text: " و "
        - text: "شبکه‌های پیش‌خور"
          en: "feed-forward networks"
        - text: " دارند و با "
        - text: "وزن‌های آموخته‌شده"
        - text: "، "
        - text: "ویژگی‌های میانی"
          en: "intermediate features"
        - text: " و "
        - text: "فعال‌سازی‌های"
          en: "activations"
        - text: " وابسته به ورودی را محاسبه می‌کنند. بنابراین، بررسی درونی مدل می‌تواند وزن‌ها و اجزای لایه‌ها، و نیز بازنمایی‌ها و "
        - text: "مسیرهای محاسباتی"
          en: "computational paths"
        - text: " دخیل در شکل‌گیری پاسخ را در بر می‌گیرد. برای نمونه، می‌توان بازنمایی یک لایه را تغییر داد و اثر آن را بر پاسخ سنجید. در این نگاه، موضوع، افزون بر وزن‌ها و "
        - text: "نورون‌های منفرد"
        - text: " چگونگی مشارکت این اجزا در پردازش است [۱، ۲]."
    - segments:
        - text: "مسئله‌ی این پژوهش، رابطه‌ی میان بازنمایی‌های درونی و رفتار مشاهده‌پذیر مدل است. پرسش محوری این است که بازنمایی‌های درونی مدل‌های زبانی بزرگ تا چه اندازه اطلاعات سودمندی برای فهم، ارزیابی و احتمالاً اثرگذاری بر رفتار آن‌ها فراهم می‌کنند. این پرسش سه چالش مرتبط را در بر می‌گیرد: فهم، یعنی اینکه آیا بازنمایی‌ها الگوهای مرتبط با رفتارهای مشخص را آشکار می‌کنند؛ ارزیابی، یعنی اینکه آیا این بازنمایی‌ها به سنجش یا پیش‌بینی رفتار کمک می‌کنند؛ و "
        - text: "مداخله"
          en: "intervention"
        - text: "، یعنی اینکه آیا تغییر بازنمایی‌های منتخب می‌تواند رفتار مدل را به شکلی سودمند و کنترل‌شده تغییر دهد. این سه، جهت‌های پژوهش‌اند و نه سه خروجی الزامی."
    - segments:
        - text: "دامنه‌ی پژوهش به یک یا چند مدل زبانی بزرگ "
        - text: "وزن‌باز"
          en: "open-weight"
        - text: " و تعداد محدودی وظیفه‌ی منتخب محدود است. یکی از کاربردهای ممکن، مطالعه‌ی "
        - text: "خطای واقعیتی"
          en: "factual error"
        - text: " در پرسش‌وپاسخ دانش‌محور است، یعنی پرسشی که پاسخ درست آن در دانش عمومی یا منبع مرجع مشخص است. این خطاها نمونه‌ای مشاهده‌پذیر از رفتار مدل‌اند، معیار درستی روشنی دارند و می‌توان آن‌ها را از راه بازنمایی‌های درونی تحلیل کرد. این مطالعه‌ی موردی نقطه‌ی شروع پژوهش است و موضوع پایان‌نامه به آن محدود نمی‌شود."
key-concepts:
  - group: "مدل و بازنمایی"
    term-fa: مدل زبانی بزرگ
    term-en: large language model (LLM)
    term-en-footnote: false
    definition:
      segments:
        - text: "مدل زبانی بزرگ، "
        - text: "شبکه‌ای عصبی"
        - text: " با "
        - text: "پارامترهای"
        - text: " آموخته‌شده از داده‌های متنی است. در بسیاری از "
        - text: "مدل‌های مولد"
          en: "generative models"
        - text: " رایج، متن ورودی به توکن‌ها تبدیل و با لایه‌های ترانسفورمر پردازش می‌شود. مدل با توجه به توکن‌های پیشین، "
        - text: "توزیع احتمال"
          en: "probability distribution"
        - text: " توکن بعدی را برآورد می‌کند و وزن‌ها این محاسبه را پارامتردهی می‌کنند. این "
        - text: "معماری"
        - text: " مبنای بررسی رابطه‌ی میان ورودی، محاسبات درونی و پاسخ تولیدشده در این پژوهش است [۱، ۲]."
  - term-fa: بازنمایی درونی
    term-en: internal representation
    term-en-footnote: false
    definition:
      segments:
        - text: "بازنمایی درونی، صورت عددی اطلاعاتی است که مدل در لایه‌های میانی برای یک ورودی می‌سازد، مانند "
        - text: "حالت‌های پنهان"
          en: "hidden states"
        - text: " و فعال‌سازی‌ها. این پژوهش بازنمایی‌ها را منبعی ممکن برای تحلیل رفتار مدل می‌داند و فرض نمی‌کند که آن‌ها لزوماً توضیح علّی رفتار را فراهم کنند [۲، ۱۳]."
  - term-fa: توکن
    term-en: token
    term-en-footnote: false
    definition: "توکن، واحدی از متن است که ممکن است واژه، بخشی از واژه یا نشانه‌ی نگارشی باشد. مدل متن را پیش از پردازش به توکن تبدیل می‌کند."
  - term-fa: لایه‌ی ترانسفورمر
    term-en: transformer layer
    term-en-footnote: false
    definition: "لایه‌ی ترانسفورمر، مرحله‌ای از پردازش مدل است که بازنمایی توکن‌ها را گام‌به‌گام تغییر می‌دهد. هر لایه معمولاً سازوکار توجه و شبکه‌ی پیش‌خور دارد."
  - term-fa: زمینه
    term-en: context
    term-en-footnote: false
    definition: "زمینه، اطلاعاتی است که در پنجره‌ی ورودی مدل قرار می‌گیرد و بر پاسخ آن اثر می‌گذارد."
  - term-fa: فعال‌سازی
    term-en: activation
    term-en-footnote: false
    definition: "فعال‌سازی به مقادیر عددی یک لایه‌ی شبکه برای یک ورودی مشخص اشاره می‌کند. بازنمایی‌ها، ویژگی‌های میانی و تحلیل‌های درونی همه از روی همین مقادیر خوانده می‌شوند."
  - term-fa: ویژگی
    definition: "ویژگی، جزء قابل‌تفسیری از بازنمایی یک لایه است که با یک جهت یا الگوی مشخص در فعال‌سازی‌ها متناظر است. در خودرمزنگار تنک، هر ویژگی معمولاً فقط برای تعداد کمی از ورودی‌ها فعال می‌شود."
  - term-fa: خودرمزنگار تنک
    term-en: sparse autoencoder (SAE)
    definition:
      segments:
        - text: "خودرمزنگار تنک، شبکه‌ای است که فعال‌سازی‌های یک لایه‌ی مدل را به مجموعه‌ای بزرگ از ویژگی‌های تنک، یعنی با تعداد کمی ویژگی فعال در هر ورودی، تجزیه و بازسازی می‌کند. هدف آن جداسازی مفاهیمی است که در یک بازنمایی با هم ترکیب شده‌اند [۱۰، ۱۱، ۱۲]."
  - group: "رفتار مدل"
    term-fa: خطای واقعیتی
    term-en: factual error
    term-en-footnote: false
    definition:
      segments:
        - text: "خطای واقعیتی به پاسخی اشاره دارد که با "
        - text: "پاسخ مرجع"
          en: "gold answer"
        - text: " یا واقعیت شناخته‌شده سازگار نیست [۵]. این اصطلاح به‌جای «توهم»، که گسترده‌تر است، به کار می‌رود. در این پژوهش، خطای واقعیتی نمونه‌ای از رفتار مدل است که به‌عنوان مطالعه‌ی موردی آغازین بررسی می‌شود."
  - group: "ابزارهای تفسیر"
    term-fa: قابلیت تفسیر مکانیکی
    term-en: mechanistic interpretability
    definition:
      segments:
        - text: "رویکردی برای ساخت و آزمودن توضیح‌های فنی درباره‌ی چگونگی محاسبه‌ی پاسخ درون شبکه است. پژوهشگر بازنمایی‌ها و فعال‌سازی‌های لایه‌ها، "
        - text: "سرهای توجه"
          en: "attention heads"
        - text: "، شبکه‌های پیش‌خور یا وزن‌ها را تحلیل می‌کند و با "
        - text: "مداخله"
        - text: "، مانند جایگزینی یک فعال‌سازی و سنجش تغییر پاسخ، نقش علّی پیشنهادی را می‌آزماید. در این رویکرد، فرضیه‌ی یک‌به‌یک میان نورون و مفهوم لزوماً فرض نمی‌شود و نقش شبکه‌ای بازنمایی‌ها سنجیده می‌شود [۲، ۸، ۹]."
  - term-fa: پروب خطی
    term-en: linear probe
    definition:
      segments:
        - text: "پروب خطی، مدل خطی ساده‌ای است که روی بازنمایی‌های یک لایه‌ی ثابت مدل آموزش داده می‌شود تا یک ویژگی معین، مانند درستی گزاره، را از آن پیش‌بینی کند. وزن‌های مدل اصلی تغییر نمی‌کنند. پروب فقط نشان می‌دهد که آن ویژگی با یک تابع خطی از بازنمایی قابل خواندن است یا نه [۱۳]."
  - term-fa: هدایت مدل
    term-en: model steering
    definition:
      segments:
        - text: "هدایت مدل، تغییر هدفمند در خروجی یا احتمال پاسخ‌های مدل است که با روش‌هایی مانند بازنویسی ورودی، تنظیم فرایند تولید یا تغییر "
        - text: "بازنمایی‌های درونی"
        - text: " هنگام اجرا ایجاد می‌شود. هدایت را با سنجش تغییر رفتار هدف و بررسی "
        - text: "افت‌های جانبی"
        - text: "، مانند کاهش دقت یا "
        - text: "تعمیم‌پذیری"
          en: "generalization"
        - text: "، ارزیابی می‌کنند. بنابراین، تغییر پاسخ نشانه‌ی کافی برای هدایت موفق و قابل‌اعتماد نیست [۱۴، ۱۵، ۱۶]."
  - term-fa: میانگین تفاضلی
    term-en: difference-in-means
    definition: "میانگین تفاضلی، بردار جهتی است که از تفاضل میانگین فعال‌سازی‌های دو گروه، مثلاً پاسخ‌های درست و نادرست، ساخته می‌شود. روشی ساده برای هدایت و تشخیص مفهوم است و به‌عنوان خط‌مبنای قوی (روش ساده‌ی مرجع برای مقایسه) به کار می‌رود [۱۳، ۱۵]."
  - group: "سنجه‌ها"
    term-fa: آنتروپی معنایی
    term-en: semantic entropy
    definition: "آنتروپی معنایی، معیاری برای ناپایداری پاسخ است که چند پاسخ نمونه‌گرفته‌شده را بر اساس هم‌معنایی خوشه‌بندی می‌کند و عدم‌قطعیت مدل را روی این خوشه‌ها می‌سنجد."
  - term-fa: کالیبراسیون
    term-en: calibration
    definition: "کالیبراسیون به میزان همخوانی اطمینانی که مدل اعلام می‌کند با نرخ واقعی درستی پاسخ‌ها اشاره دارد. مثلاً در یک مدل کالیبره‌شده، از میان پاسخ‌هایی که با اطمینان ۸۰ درصد داده می‌شوند، حدود ۸۰ درصد درست‌اند."
  - term-fa: پاسخ‌گویی انتخابی
    term-en: selective answering
    definition: "پاسخ‌گویی انتخابی، رفتاری است که در آن مدل وقتی اطمینان کافی ندارد از پاسخ دادن خودداری می‌کند. موازنه‌ی آن میان دقت پاسخ‌های داده‌شده و پوشش پرسش‌ها سنجیده می‌شود."

goal:
  paragraphs:
    - segments:
        - text: "هدف کلی این پژوهش، بررسی توان بازنمایی‌های درونی برای فهم و ارزیابی رفتار مدل‌های زبانی بزرگ و کاوش کاربرد احتمالی آن‌ها در اثرگذاری بر این رفتار است. اهداف جزئی عبارت‌اند از: (۱) مرور و تحلیل رویکردهای موجود برای مطالعه‌ی بازنمایی‌های درونی مدل‌های زبانی بزرگ؛ (۲) بررسی رابطه‌ی میان بازنمایی‌های درونی و رفتارهای مشاهده‌پذیر مدل؛ (۳) سنجش کاربرد بازنمایی‌های درونی در ارزیابی یا پیش‌بینی رفتار؛ (۴) کاوش رویکردهای ممکن برای اثرگذاری بر رفتار مدل از راه بازنمایی‌های درونی، در صورت امکان. هدف چهارم اکتشافی است و موفقیت آن از پیش فرض نمی‌شود."
    - segments:
        - text: "جنبه‌ی نوآوری: پژوهش‌های پیشین جنبه‌های گوناگونی از بازنمایی‌های درونی و رفتار مدل را بررسی کرده‌اند. برای نمونه، "
        - text: "اورگاد"
          en: "Orgad et al."
        - text: " و همکاران [۳۴] خطاها را با نمونه‌گیری دسته‌بندی کرده و پروب را روی بازنمایی خام به کار برده‌اند، "
        - text: "چن"
          en: "Chen et al."
        - text: " و همکاران [۳۵] ویژگی‌های تنک را برای تشخیص توهم سنجیده‌اند، و شواهد موجود نشان می‌دهد خودرمزنگارهای تنک در برابر خط‌مبناهای ساده برتری پایدار ندارند [۱۵، ۲۴]. سهم بالقوه‌ی این پژوهش در بررسی بازنمایی‌های درونی به‌عنوان ابزاری برای مطالعه‌ی رفتار مدل است: سنجش رابطه‌ی آن‌ها با الگوهای رفتاری مشاهده‌پذیر و کاوش کاربرد آن‌ها در ارزیابی یا مداخله. این سهم ممکن است کاربردی تازه، یافته‌ای تجربی، مقایسه‌ای کنترل‌شده، ترکیبی از روش‌های موجود یا بهبودی روش‌شناختی باشد. صورت دقیق آن پس از مرور نظام‌مند پیشینه و آزمایش‌های مقدماتی تعیین می‌شود."
    - segments:
        - text: "نتایج مورد انتظار: (۱) تحلیلی تجربی از رابطه‌ی بازنمایی‌های درونی با رفتارهای منتخب مدل؛ (۲) ارزیابی سودمندی و محدودیت‌های رویکردهای مبتنی بر بازنمایی برای فهم یا ارزیابی رفتار؛ (۳) شواهد تجربی درباره‌ی امکان اثرگذاری بر رفتار از راه بازنمایی‌ها، اگر این جهت بررسی شود؛ (۴) شناسایی جهت‌های امیدبخش برای پژوهش‌های بعدی. بسته به یافته‌ها، خروجی پیاده‌سازی ممکن است یک "
        - text: "خط لوله‌ی تحلیل"
          en: "analysis pipeline"
        - text: "، "
        - text: "نمونه‌ی اولیه"
          en: "prototype"
        - text: " برای ارزیابی مبتنی بر بازنمایی، مدل پیش‌بینی یا طبقه‌بندی رفتار، روش آزمایشی مداخله یا مطالعه‌ی تطبیقی تجربی باشد. این موارد خروجی‌های ممکن‌اند و نه فهرستی از تحویل‌دادنی‌های الزامی."
research-questions:
  - "بازنمایی‌های درونی چگونه می‌توانند برای بررسی و فهم رفتار مدل‌های زبانی بزرگ به کار روند؟"
  - "بازنمایی‌های درونی تا چه اندازه اطلاعات سودمندی برای ارزیابی یا پیش‌بینی رفتار مدل فراهم می‌کنند، و آیا این اطلاعات فراتر از ارزیابی مبتنی بر خروجی است؟"
  - "آیا می‌توان از راه بازنمایی‌های درونی بر رفتار مدل اثر گذاشت، و چه محدودیت‌ها و موازنه‌هایی در چنین مداخله‌هایی پدید می‌آید؟"
necessity:
  paragraphs:
    - segments:
        - text: "ارزیابی رفتاری"
          en: "behavioral evaluation"
        - text: " [۳، ۴] نشان می‌دهد مدل در چه شرایطی چه پاسخی می‌دهد، اما روشن نمی‌کند این پاسخ در درون مدل چگونه تولید شده است [۲، ۸]. برای پر کردن این فاصله، پژوهش‌های قابلیت تفسیر مکانیکی، "
        - text: "بازنمایی‌های درونی"
        - text: " و "
        - text: "مدارهای محاسباتی"
          en: "computational circuits"
        - text: " را بررسی می‌کنند [۲، ۸، ۹، ۱۷]. بعضی روش‌ها برای یک ورودی مشخص، "
        - text: "گراف محاسباتی"
          en: "prompt-specific computational graph"
        - text: " وابسته به همان ورودی می‌سازند. سپس با "
        - text: "مداخله‌ی علّی"
          en: "causal intervention"
        - text: "، مثلاً تغییر یک مؤلفه‌ی درونی و سنجش اثر آن بر پاسخ، فرضیه را می‌آزمایند [۸، ۹]."
    - segments:
        - text: "رفتارهایی مانند امتناع و تولید اطلاعات نادرست، با آزمون بیرونی تنها تا حدی سنجیده می‌شوند. تفسیر مکانیکی برای برخی ورودی‌ها سازوکار تولید پاسخ را به‌صورت علّی نشان داده است [۸، ۹]، هرچند پوشش آن هنوز محدود است. نمونه‌ی منتشرشده‌ی شکل ۲ نشان می‌دهد که جایگزینی ویژگی میانی «تگزاس» با «کالیفرنیا» پاسخ مدل را از «آستین» به «ساکرامنتو» تغییر می‌دهد. اما "
        - text: "شواهد علّی موضعی"
          en: "localized causal evidence"
        - text: " توضیح کاملی از رفتار مدل فراهم نمی‌کنند [۸، ۹]. بنابراین، بازنمایی‌های درونی ممکن است اطلاعاتی فراتر از خروجی درباره‌ی رفتار مدل در اختیار بگذارند، اما اینکه این اطلاعات تا چه اندازه برای فهم، ارزیابی یا اصلاح رفتار سودمند است، پرسشی تجربی است که باید بررسی شود."
    - segments:
        - text: "از نظر کاربردی، ارزیابی کم‌هزینه‌ی رفتار مدل‌های وزن‌باز پیش از به‌کارگیری در سامانه‌های حساس ارزش عملی دارد. در کاربردهایی مانند پاسخ‌گویی خودکار به کاربران و جست‌وجوی دانش سازمانی، پاسخ نادرست با اطمینان بالا خسارت مستقیم دارد. اگر بازنمایی‌های درونی بتوانند بدون آموزش مجدد مدل نشانه‌هایی از چنین رفتارهایی فراهم کنند، می‌توانند در پایش این سامانه‌ها به کار روند. بنابراین، ارزیابی رفتار و سنجش مستقل تفسیرها هر دو لازم‌اند. پیشینه‌ی این بحث در ⁦۴-۳⁩ و امکان‌سنجی آن در ⁦۴-۲⁩ آمده است."
