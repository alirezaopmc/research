intro: >-
  پژوهش با رویکردی مرحله‌ای پیش می‌رود: ابتدا دامنه مسئله و رفتارهای
  مورد بررسی از طریق مرور پیشینه روشن می‌شود؛ سپس گزینه‌های ارزیابی و
  تحلیل در چند موقعیت منتخب به کار گرفته می‌شوند؛ در پایان، امکان و
  پیامدهای به‌کارگیری یک یا چند راهبرد هدایت بررسی خواهد شد. انتخاب
  مدل‌ها، موقعیت‌ها و روش‌های دقیق با توجه به شواهد پیشینه، امکان اجرا
  و محدودیت منابع محاسباتی نهایی می‌شود.
theory:
  - segments:
      - text: "مطالعه منابع کلاسیک و معاصر درباره رفتار مدل‌های زبانی بزرگ، روش‌های ارزیابی، سوگیری، پایداری و راهبردهای هدایت؛ با توجه به منابع در دسترس، اولویت با پژوهش‌های قابل بازتولید روی مدل‌های متن‌باز خواهد بود."
  - >-
    انتخاب چند وظیفه و موقعیت ارزیابی و تعریف رفتارهای موردنظر، معیارهای
    سنجش و شرایط مقایسه بر اساس مرور پیشینه و امکان‌سنجی اولیه.
  - >-
    بررسی روش‌های مناسب برای توصیف و تحلیل رفتار در نمونه‌های منتخب،
    شامل تحلیل خروجی و در صورت توجیه پژوهشی، بررسی اطلاعات درونی مدل.
implementation:
  - >-
    راه‌اندازی خط لوله‌ای بازتولیدپذیر برای اجرای مدل‌ها در موقعیت‌های
    منتخب و ثبت تنظیمات، داده‌ها و شاخص‌های ارزیابی در sandbox/.
  - >-
    مقایسه رویکردهای منتخب با خط‌مبناهای مناسب و تحلیل نتایج کمی و کیفی
    برای شناسایی الگوها، محدودیت‌ها و تفاوت رفتار میان موقعیت‌ها.
  - segments:
      - text: "در صورت پشتیبانی شواهد و امکان اجرا، آزمون یک یا چند راهبرد هدایت و ارزیابی اثر آن‌ها بر معیارهای مطلوب و پیامدهای جانبی."
