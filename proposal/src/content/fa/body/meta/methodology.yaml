intro:
  segments:
    - text: "پژوهش با یک مطالعه‌ی موردی مشخص آغاز می‌شود: تشخیص خطای واقعیتی در پرسش‌وپاسخ دانش‌محور با استفاده از ویژگی‌های تنک لایه‌های میانی مدل. ابتدا دامنه‌ی مسئله و معیارهای درستی با مرور پیشینه روشن می‌شود؛ سپس خودرمزنگارهای تنک و خط‌مبناها در مجموعه‌داده‌های منتخب ارزیابی می‌شوند؛ در پایان، امکان و پیامدهای به‌کارگیری راهبرد هدایت یا پاسخ‌گویی انتخابی بررسی خواهد شد. انتخاب دقیق مدل‌ها، لایه‌ها و روش‌ها با توجه به شواهد پیشینه، امکان اجرا و محدودیت "
    - text: "منابع محاسباتی"
      en: "computational resources"
    - text: " نهایی می‌شود."
resources:
  segments:
    - text: "از نظر محاسباتی، این پژوهش با منابع در دسترس در Google Colab Pro طراحی می‌شود. مدل اصلی این پژوهش Gemma 2 9B است [۱۹] و برای همان مدل و لایه‌های میانی، خودرمزنگارهای تنک منتشرشده‌ی Gemma Scope به کار می‌روند [۱۷]. مدل Gemma 2 2B برای توسعه و بررسی‌های سلامت خط لوله استفاده می‌شود. اجرای استنتاج و استخراج فعال‌سازی‌ها روی "
    - text: "واحد پردازش گرافیکی"
      en: "graphics processing unit (GPU)"
    - text: " با حافظه‌ی حدود ۲۴ گیگابایت یا بیشتر برنامه‌ریزی شده است؛ در صورت محدودیت حافظه، از کوانتیزاسیون ۸ بیتی یا استخراج لایه‌به‌لایه برای انطباق با منابع استفاده خواهد شد. آموزش مدل زبانی یا آموزش خودرمزنگار تنک جدید در دامنه‌ی این پژوهش نیست."
theory:
  - segments:
      - text: "مرور منابع کلاسیک و معاصر درباره‌ی خطای واقعیتی و معیارهای آن [۵، ۲۰]، "
      - text: "عدم قطعیت"
        en: "uncertainty"
      - text: " و سازگاری پاسخ‌ها [۲۱–۲۳]، بازنمایی‌های خطی درستی [۶، ۱۳]، خودرمزنگارهای تنک و ارزیابی آن‌ها در برابر خط‌مبناها [۱۲، ۱۵، ۱۷، ۲۴–۲۵]؛ با توجه به منابع در دسترس، اولویت با پژوهش‌های قابل بازتولید روی مدل‌های "
      - text: "متن‌باز"
        en: "open-source"
      - text: " خواهد بود."
  - segments:
      - text: "انتخاب مجموعه‌داده‌ها و تعریف عملیاتی خطا، معیارهای سنجش و شرایط مقایسه بر اساس مرور پیشینه و "
      - text: "امکان‌سنجی"
        en: "feasibility"
      - text: " اولیه روی Gemma 2 2B."
  - segments:
      - text: "تدوین مبنای نظری تفکیک سه کلاس پاسخ (درست، خطای سازگار و خطای ناسازگار) بر پایه‌ی تمایز خطای با دانش و خطای بدون دانش [۶] و تعریف آماری بازنمایی‌های خطی درستی [۱۳]؛ این تعریف پیش از اجرای آزمایش‌ها در مخزن پژوهش ثبت می‌شود تا ارزیابی‌ها قابل آزمون باشند."
implementation:
  - segments:
      - text: "راه‌اندازی "
      - text: "خط لوله‌ای بازتولیدپذیر"
        en: "reproducible pipeline"
      - text: " برای استخراج فعال‌سازی‌ها، اجرای خودرمزنگارهای تنک و "
      - text: "خط‌مبناها"
        en: "baselines"
      - text: "، و ثبت تنظیمات، داده‌ها و شاخص‌ها در یک محیط آزمایشی جداگانه. بررسی‌های سلامت پیش از هر آزمایش شامل شکل تنسورها، میانگین تعداد ویژگی‌های فعال و خطای بازسازی است [۱۷]."
  - segments:
      - text: "مقایسه‌ی ویژگی‌های خودرمزنگارهای تنک با "
      - text: "پروب خطی"
      - text: " روی بازنمایی خام، با پروب آنتروپی معنایی [۲۶] و میانگین تفاضلی [۱۳، ۱۵] به‌عنوان خط‌مبناهای اضافی، با داده‌ی جفت‌شده و تقسیم‌بندی یکسان؛ تحلیل خطاها و بررسی ویژگی‌های وابسته به قالب یا موقعیت توکن، برای جلوگیری از تفسیر گمراه‌کننده."
  - segments:
      - text: "در صورت پشتیبانی شواهد و امکان اجرا، آزمون راهبرد هدایت (مانند تقویت یا خاموش‌کردن ویژگی‌ها) در برابر خط‌مبنای دستور و میانگین تفاضلی [۱۳، ۱۵] و آستانه‌ی پاسخ‌گویی انتخابی، و ارزیابی اثر آن‌ها بر دقت، پوشش و افت‌های جانبی."
  - segments:
      - text: "ساختار کد در چند ماژول کوچک (بارگذاری مدل و خودرمزنگار، استخراج فعال‌سازی، ارزیابی و گزارش‌دهی) سازماندهی می‌شود و برای بارگذاری خودرمزنگارهای تنک از کتابخانه‌ی متن‌باز "
      - text: "SAELens"
      - text: " استفاده می‌شود. اجرای آزمایش‌ها در چارچوب بودجه‌ی محاسباتی موجود برنامه‌ریزی می‌شود."
dimensions:
  - key: methodology-models
    placeholder:
      segments:
        - text: "مدل اصلی Gemma 2 9B (نسخه‌ی پایه) [۱۹] و مدل آزمایشی Gemma 2 2B. خودرمزنگارهای تنک منتشرشده‌ی Gemma Scope برای "
        - text: "لایه‌های باقی‌مانده"
          en: "residual stream"
        - text: " در چند لایه‌ی میانی با سطح تنکی ثابت انتخاب می‌شوند [۱۷]؛ دلیل انتخاب، سازگاری با بودجه‌ی Colab Pro و وجود خودرمزنگارهای آماده است."
  - key: methodology-datasets
    placeholder:
      segments:
        - text: "TriviaQA [۲۷] و Natural Questions [۲۸] با نسخه‌ی باز NQ-Open [۲۹] برای دانش عمومی؛ PopQA [۳۰] برای دانش کم‌بسامد؛ TruthfulQA [۲۰] برای پرسش‌هایی که مدل را به تکرار باورهای غلط عمومی می‌آزمایند. تقسیم آموزش، اعتبارسنجی و آزمون بر اساس پرسش انجام می‌شود تا نشت داده رخ ندهد؛ آزمون خارج از توزیع، با جابه‌جایی مجموعه‌داده، برای سنجش تعمیم‌پذیری به کار می‌رود."
  - key: methodology-behaviors
    placeholder:
      segments:
        - text: "«پاسخ درست»: پاسخی که با پاسخ طلایی یا واقعیت شناخته‌شده سازگار است. «خطای سازگار»: پاسخ نادرستی که در نمونه‌گیری‌های مکرر تکرار می‌شود. «خطای ناسازگار»: پاسخ نادرستی که در نمونه‌گیری‌ها پراکنده است؛ این کلاس تعبیر عملیاتی «ندانستن» است و با فقدان دانش در پارامترها یکی نیست [۶، ۲۲–۲۳]. تعداد نمونه‌گیری‌ها (مانند ۵ یا ۱۰ نمونه با دمای ۰.۷) و آستانه‌ی سازگاری در پروتکل پیش‌ثبت‌شده تثبیت می‌شوند. سوگیری و ناپایداری به‌عنوان رفتارهای مکمل در ارزیابی بیرونی گزارش می‌شوند؛ هدف اصلی، تفکیک دو کلاس خطا از پاسخ درست است."
  - key: methodology-metrics
    placeholder:
      segments:
        - text: "برای تشخیص، "
        - text: "AUROC"
          en: "area under the ROC curve"
        - text: " و "
        - text: "AUPR"
          en: "area under the precision-recall curve"
        - text: "؛ برای آستانه‌ی ثابت، "
        - text: "F1"
          en: "F1 score"
        - text: "؛ برای کیفیت احتمال‌ها، "
        - text: "خطای کالیبراسیون"
          en: "calibration error"
        - text: "؛ برای تفکیک سه کلاس، ماتریس سردرگمی؛ و برای پرسش سوم، دقت در پوشش‌های ثابت پاسخ‌گویی انتخابی. فاصله‌ی اطمینان با "
        - text: "بوت‌استرپ"
          en: "bootstrap"
        - text: " روی پرسش‌ها محاسبه می‌شود."
  - key: methodology-baselines
    placeholder:
      segments:
        - text: "انتروپی توکنی بر پایه‌ی میانگین "
        - text: "log-probability"
          en: "log-probability"
        - text: " توکن‌های پاسخ، "
        - text: "سازگاری نمونه‌گیری‌شده"
          en: "self-consistency"
        - text: "، "
        - text: "آنتروپی معنایی"
          en: "semantic entropy"
        - text: " [۲۲–۲۳]، پروب آنتروپی معنایی روی فعال‌سازی‌های یک پاسخ [۲۶]، پروب خطی روی بازنمایی خام با لایه‌ی منتخب [۱۳]، میانگین تفاضلی [۱۳، ۱۵] و، در صورت انجام پرسش سوم، خط‌مبنای "
        - text: "بردار خواندن"
          en: "reading vector"
        - text: " از رویکرد مهندسی بازنمایی [۱۴]، و خودارزیابی پاسخ [۲۱]."
  - key: methodology-analysis
    placeholder:
      segments:
        - text: "پروتکل ثبت‌شده‌ی پیش از اجرا با تقسیم‌بندی ثابت؛ تکرار هر آزمایش با سه بذر "
        - text: "تصادفی"
          en: "random seed"
        - text: "؛ آزمون "
        - text: "معناداری آماری"
          en: "statistical significance"
        - text: " برای مقایسه‌ی ویژگی‌ها و خط‌مبناها؛ "
        - text: "ابلیشن"
          en: "ablation"
        - text: " روی تعداد ویژگی‌ها، لایه و عرض خودرمزنگار؛ و آزمون انتقال: آموزش پروب روی یک مجموعه‌داده و آزمون روی مجموعه‌ی دیگر."
