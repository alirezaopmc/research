intro:
  segments:
    - text: "پژوهش با یک مطالعه‌ی موردی مشخص آغاز می‌شود: تشخیص خطای واقعیتی در پرسش‌وپاسخ دانش‌محور با استفاده از ویژگی‌های تنک لایه‌های میانی مدل. ابتدا دامنه‌ی مسئله و معیارهای درستی از طریق مرور پیشینه روشن می‌شود؛ سپس خودرمزنگارهای تنک و خط‌مبناها در مجموعه‌داده‌های منتخب ارزیابی می‌شوند؛ در پایان، امکان و پیامدهای به‌کارگیری راهبرد هدایت یا امتناع بررسی خواهد شد. انتخاب دقیق مدل‌ها، لایه‌ها و روش‌ها با توجه به شواهد پیشینه، امکان اجرا و محدودیت "
    - text: "منابع محاسباتی"
      en: "computational resources"
    - text: " نهایی می‌شود."
resources:
  segments:
    - text: "از نظر محاسباتی، این پژوهش با منابع در دسترس در Google Colab Pro طراحی می‌شود. مدل اصلی Gemma 2 9B خواهد بود [۲۱] و برای همان مدل و لایه‌های میانی، خودرمزنگارهای تنک منتشرشده‌ی Gemma Scope به کار می‌روند [۱۵]. مدل Gemma 2 2B برای توسعه و بررسی‌های سلامت خط لوله استفاده می‌شود. اجرای استنتاج و استخراج فعال‌سازی‌ها روی "
    - text: "واحد پردازش گرافیکی"
      en: "graphics processing unit (GPU)"
    - text: " با حافظه‌ی حدود ۲۴ گیگابایت یا بیشتر برنامه‌ریزی شده است؛ آموزش مدل زبانی یا آموزش خودرمزنگار تنک جدید در دامنه‌ی این پژوهش نیست."
theory:
  - segments:
      - text: "مرور منابع کلاسیک و معاصر درباره‌ی خطای واقعیتی و معیارهای آن [۱۸، ۲۵]، "
      - text: "عدم قطعیت"
        en: "uncertainty"
      - text: " و سازگاری پاسخ‌ها [۵، ۱۹–۲۰]، بازنمایی‌های خطی درستی [۱۴] و خودرمزنگارهای تنک [۱۵–۱۶]؛ با توجه به منابع در دسترس، اولویت با پژوهش‌های قابل بازتولید روی مدل‌های "
      - text: "متن‌باز"
        en: "open-source"
      - text: " خواهد بود."
  - segments:
      - text: "انتخاب مجموعه‌داده‌ها و تعریف عملیاتی خطا، معیارهای سنجش و شرایط مقایسه بر اساس مرور پیشینه و "
      - text: "امکان‌سنجی"
        en: "feasibility"
      - text: " اولیه روی Gemma 2 2B."
  - segments:
      - text: "تدوین مبنای نظری تفکیک «ندانستن» از «خطای واقعیتی» و تعریف آماری بازنمایی‌های خطی درستی [۱۴]؛ این تعریف پیش از اجرای آزمایش‌ها ثبت می‌شود تا ارزیابی‌ها قابل آزمون باشند."
implementation:
  - segments:
      - text: "راه‌اندازی "
      - text: "خط لوله‌ای بازتولیدپذیر"
        en: "reproducible pipeline"
      - text: " برای استخراج فعال‌سازی‌ها، اجرای خودرمزنگارهای تنک و "
      - text: "خط‌مبناها"
        en: "baselines"
      - text: "، و ثبت تنظیمات، داده‌ها و شاخص‌ها در یک محیط آزمایشی جداگانه. بررسی‌های سلامت پیش از هر آزمایش شامل شکل تنسورها، میانگین تعداد ویژگی‌های فعال و خطای بازسازی است [۱۵]."
  - segments:
      - text: "مقایسه‌ی ویژگی‌های خودرمزنگارهای تنک با "
      - text: "پروب خطی"
        en: "linear probe"
      - text: " روی بازنمایی خام، با داده‌ی جفت‌شده و تقسیم‌بندی یکسان؛ تحلیل خطاها و بررسی ویژگی‌های وابسته به قالب یا موقعیت توکن، برای جلوگیری از تفسیر گمراه‌کننده."
  - segments:
      - text: "در صورت پشتیبانی شواهد و امکان اجرا، آزمون راهبرد هدایت (مانند تقویت یا خاموش‌کردن ویژگی‌ها) یا آستانه‌ی امتناع، و ارزیابی اثر آن‌ها بر دقت، پوشش و افت‌های جانبی."
  - segments:
      - text: "ساختار کد در چند ماژول کوچک (بارگذاری مدل و خودرمزنگار، استخراج فعال‌سازی، ارزیابی و گزارش‌دهی) سازمان می‌یابد و برای بارگذاری خودرمزنگارهای تنک از کتابخانه‌ی متن‌باز "
      - text: "SAELens"
      - text: " استفاده می‌شود. اجرای آزمایش‌ها در چارچوب بودجه‌ی محاسباتی موجود برنامه‌ریزی می‌شود."
dimensions:
  - key: methodology-models
    placeholder:
      segments:
        - text: "مدل اصلی Gemma 2 9B (نسخه‌ی پایه) [۲۱] و مدل آزمایشی Gemma 2 2B. خودرمزنگارهای تنک منتشرشده‌ی Gemma Scope برای "
        - text: "لایه‌های باقی‌مانده"
          en: "residual stream"
        - text: " در چند لایه‌ی میانی با سطح تنکی ثابت انتخاب می‌شوند [۱۵]؛ دلیل انتخاب، سازگاری با بودجه‌ی Colab Pro و وجود خودرمزنگارهای آماده است."
  - key: methodology-datasets
    placeholder:
      segments:
        - text: "TriviaQA [۲۲] و NQ-Open [۲۳] برای دانش عمومی؛ PopQA [۲۴] برای دانش کم‌بسامد؛ TruthfulQA [۲۵] برای پرسش‌هایی که مدل را به تکرار باورهای غلط عمومی می‌آزمایند. تقسیم آموزش، اعتبارسنجی و آزمون بر اساس پرسش انجام می‌شود تا نشت داده رخ ندهد؛ آزمون خارج از توزیع، با جابه‌جایی مجموعه‌داده، برای سنجش تعمیم‌پذیری به کار می‌رود."
  - key: methodology-behaviors
    placeholder:
      segments:
        - text: "«خطای واقعیتی»: پاسخی که با پاسخ طلایی یا واقعیت شناخته‌شده سازگار نیست. «ندانستن»: مواردی که مدل امتناع می‌کند یا پاسخ‌های نمونه‌گیری‌شده‌اش با هم ناسازگارند [۱۹–۲۰]. سوگیری و ناپایداری به‌عنوان رفتارهای مکمل در ارزیابی بیرونی گزارش می‌شوند؛ هدف اصلی، خطای واقعیتی است."
  - key: methodology-metrics
    placeholder:
      segments:
        - text: "برای تشخیص، "
        - text: "AUROC"
          en: "area under the ROC curve"
        - text: " و "
        - text: "AUPR"
          en: "area under the precision-recall curve"
        - text: "؛ برای آستانه‌ی ثابت، "
        - text: "F1"
          en: "F1 score"
        - text: "؛ برای کیفیت احتمال‌ها، میزان "
        - text: "کالیبراسیون"
          en: "calibration error"
        - text: "؛ و برای پرسش سوم، دقت در نرخ‌های ثابت امتناع. فاصله‌ی اطمینان با "
        - text: "بوت‌استرپ"
          en: "bootstrap"
        - text: " روی پرسش‌ها محاسبه می‌شود."
  - key: methodology-baselines
    placeholder:
      segments:
        - text: "انتروپی توکنی بر پایه‌ی "
        - text: "log-probability"
          en: "log-probability"
        - text: "، "
        - text: "سازگاری نمونه‌گیری‌شده"
          en: "self-consistency"
        - text: "، "
        - text: "آنتروپی معنایی"
          en: "semantic entropy"
        - text: " [۱۹–۲۰]، پروب خطی روی بازنمایی خام با لایه‌ی منتخب و، در صورت انجام پرسش سوم، خط‌مبنای "
        - text: "بردار خواندن"
          en: "reading vector"
        - text: " از رویکرد مهندسی بازنمایی [۴]."
  - key: methodology-analysis
    placeholder:
      segments:
        - text: "پروتکل ثبت‌شده‌ی پیش از اجرا با تقسیم‌بندی ثابت؛ تکرار هر آزمایش با سه بذر "
        - text: "تصادفی"
          en: "random seed"
        - text: "؛ آزمون "
        - text: "معناداری آماری"
          en: "statistical significance"
        - text: " برای مقایسه‌ی ویژگی‌ها و خط‌مبناها؛ "
        - text: "ابلیشن"
          en: "ablation"
        - text: " روی تعداد ویژگی‌ها، لایه و عرض خودرمزنگار؛ و آزمون انتقال: آموزش پروب روی یک مجموعه‌داده و آزمون روی مجموعه‌ی دیگر."
