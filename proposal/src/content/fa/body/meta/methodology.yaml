intro: >-
  روش اجرای پژوهش در دو بخش تئوری و پیاده‌سازی پیش‌بینی می‌شود؛
  هر دو بخش با محدودیت منابع محاسباتی و تمرکز بر تکرارپذیری
  طراحی شده‌اند.
theory:
  - segments:
      - text: "مطالعه منابع کلاسیک و معاصر درباره توهم در مدل‌های زبانی بزرگ، تفسیرپذیری مکانیکی، و خودرمزنگارهای پراکنده؛ اولویت با مقالات قابل اجرا روی مدل‌های متن‌باز و ابزارهای موجود مانند "
      - text: "SAELens"
        en: "SAELens (Sparse Autoencoder training toolkit)"
      - text: "."
  - >-
    تعریف مجموعه وظایف ارزیابی: سؤالات حقایقی، نسبت‌های
    شناخته‌شده/ناشناخته، و نمونه‌های کنترل‌شده برای اندازه‌گیری آگاهی از
    دانش پیش از تولید پاسخ.
  - >-
    استخراج ویژگی‌های خودرمزنگار پراکنده از لایه‌های منتخب و تحلیل همبستگی
    آن‌ها با خطا، اطمینان ظاهری، و الگوهای امتناع از پاسخ.
implementation:
  - >-
    پیاده‌سازی خط لوله استخراج فعال‌سازی، آموزش/بارگذاری خودرمزنگار پراکنده، و
    ثبت شاخص‌ها در نوت‌بوک‌های Colab با نسخه‌بندی نتایج در sandbox/.
  - segments:
      - text: "ساخت آستانه‌ها و طبقه‌بندهای مبتنی بر ویژگی برای تشخیص توهم، و مقایسه با "
      - text: "خط‌مبناهای"
        en: "Baselines"
      - text: " ساده (آنتروپی لگاریتم احتمال، "
      - text: "خودسازگاری"
        en: "Self-Consistency"
      - text: ")."
  - segments:
      - text: "آزمون یک یا دو مداخله سبک پیش از تولید (مثلاً هشدار به کاربر یا بازنویسی محتاطانه) و گزارش "
      - text: "مبادله"
        en: "Trade-off"
      - text: " بین کاهش خطا و نرخ پاسخ."
