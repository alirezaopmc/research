intro:
  segments:
    - text: "پژوهش در شش مرحله‌ی اکتشافی انجام می‌شود. نخست، مرور پیشینه و پالایش پرسش‌های پژوهش. دوم، آماده‌سازی آزمایش، شامل انتخاب مدل، وظیفه، داده و روش‌های تحلیل بازنمایی بر پایه‌ی پیشینه و منابع محاسباتی در دسترس. سوم، تحلیل بازنمایی‌های درونی و رابطه‌ی آن‌ها با رفتارهای منتخب. چهارم، بررسی یک یا چند کاربرد، مانند ارزیابی، پیش‌بینی، طبقه‌بندی یا مداخله، بسته به یافته‌های مقدماتی. پنجم، ارزیابی پایایی، سودمندی، محدودیت‌ها و هزینه‌ی محاسباتی رویکرد منتخب. ششم، تفسیر یافته‌ها، ثبت محدودیت‌ها و نگارش. دامنه‌ی پژوهش، رابطه‌ی بازنمایی‌های درونی و رفتار مشاهده‌پذیر در مدل‌های منتخب و تعداد محدودی وظیفه است. مرور پیشینه و آزمایش‌های مقدماتی یک کاربرد اصلی و حداکثر یک کاربرد فرعی را برای تمرکز پایان‌نامه تعیین می‌کنند. خطای واقعیتی در پرسش‌وپاسخ دانش‌محور، مطالعه‌ی موردی آغازین است."
resources:
  segments:
    - text: "آزمایش‌های اولیه روی "
    - text: "گوگل کولب پرو"
      en: "Google Colab Pro"
    - text: " و "
    - text: "واحد پردازش گرافیکی"
      en: "graphics processing unit (GPU)"
    - text: " در دسترس، مانند T4 با ۱۶ گیگابایت حافظه، و با مدل‌های وزن‌باز و منابع باز تحلیل بازنمایی انجام می‌شوند. برای نمونه، وزن‌های Gemma 2 2B با "
    - text: "نیم‌دقت"
      en: "half precision (fp16)"
    - text: " حدود ۵ گیگابایت حافظه می‌گیرند و همراه با یک خودرمزنگار لایه‌ای Gemma Scope روی چنین پردازنده‌ای جا می‌شوند. فعال‌سازی‌ها یک‌بار استخراج و "
    - text: "ذخیره‌سازی"
      en: "activation caching"
    - text: " می‌شوند تا تحلیل‌های بعدی بدون اجرای دوباره‌ی مدل انجام شوند. اندازه‌ی مدل، تعداد آزمایش‌ها و روش‌های تحلیل بر پایه‌ی منابع در دسترس انتخاب می‌شوند. گسترش‌های پرهزینه، مانند مدل‌های بزرگ‌تر یا آزمون اثر "
    - text: "کوانتیزه‌سازی"
      en: "quantization"
    - text: "، به نتایج مقدماتی وابسته‌اند. آموزش مدل زبانی بزرگ جدید در دامنه‌ی این پژوهش نیست."
note:
  segments:
    - text: "مدل، وظیفه، داده، سنجه‌ها و طرح مقایسه پس از مرور پیشینه و امکان‌سنجی اولیه انتخاب و پیش از آزمایش‌های اصلی در مخزن پژوهش ثبت می‌شوند. هر تغییر با ذکر دلیل ثبت و در پایان‌نامه گزارش می‌شود."
theory:
  - segments:
      - text: "مرور منابع در پنج محور: رفتار مدل‌های زبانی بزرگ و قابلیت اطمینان آن‌ها [۳، ۴، ۵، ۱۹]، بازنمایی‌های درونی [۶، ۱۳، ۳۲]، روش‌های تحلیل بازنمایی مانند پروب و خودرمزنگار تنک [۱۰، ۱۲، ۱۷، ۲۴]، ارزیابی مبتنی بر خروجی و بازنمایی [۲۰، ۲۱، ۲۵، ۳۴]، و مداخله و هدایت [۱۴، ۱۵، ۳۱]. با توجه به منابع در دسترس، اولویت با پژوهش‌های قابل بازتولید روی مدل‌های وزن‌باز است."
  - segments:
      - text: "پالایش پرسش‌های پژوهش و انتخاب کاربرد اصلی بر پایه‌ی مرور پیشینه و "
      - text: "امکان‌سنجی"
      - text: " اولیه، و بررسی اینکه آیا ترکیب، کاربرد یا اصلاح رویکردهای موجود می‌تواند بینش تازه‌ای درباره‌ی مسئله فراهم کند."
  - segments:
      - text: "تدوین تعریف عملیاتی رفتارهای منتخب و معیار درستی آن‌ها. برای مطالعه‌ی موردی خطای واقعیتی، این تعریف می‌تواند بر مقایسه با پاسخ مرجع و الگوی تکرار پاسخ در نمونه‌های چندگانه‌ی یک پرسش استوار باشد [۶، ۳۴، ۴۱]."
implementation:
  - segments:
      - text: "راه‌اندازی خط لوله‌ای بازتولیدپذیر برای استخراج فعال‌سازی‌ها و تحلیل بازنمایی، و ثبت تنظیمات، داده‌ها و نتایج در یک محیط آزمایشی جداگانه. بسته به یافته‌ها و امکان اجرا، روش‌هایی مانند تحلیل حالت‌های پنهان، پروب خطی و دیگر پروب‌ها، تحلیل ویژگی و خودرمزنگارهای تنک بررسی می‌شوند. اجرای همه‌ی این روش‌ها الزامی نیست. اگر خودرمزنگار تنک به کار رود، بررسی‌های سلامت مانند خطای بازسازی ثبت می‌شوند [۱۷]."
  - segments:
      - text: "پیاده‌سازی کاربرد یا کاربردهای منتخب (⁦۴-۲-۳⁩) و مقایسه‌ی آن‌ها با رویکردهای موجود روی داده و تقسیم‌بندی یکسان؛ تحلیل خطاها و بررسی وابستگی به قالب یا موقعیت توکن، برای جلوگیری از تفسیر گمراه‌کننده."
  - segments:
      - text: "اگر تحلیل مقدماتی بازنمایی‌هایی مرتبط با رفتارهای مشخص بیابد، بررسی می‌شود که آیا مداخله بر آن‌ها می‌تواند پاسخ مدل را تغییر دهد. در این آزمایش‌ها هم اثر مطلوب و هم پیامدهای ناخواسته، مانند افت دقت یا تعمیم‌پذیری، سنجیده می‌شوند. این بخش اکتشافی است و نتیجه‌ی منفی آن نیز گزارش می‌شود."
dimensions:
  - key: methodology-models
    placeholder:
      segments:
        - text: "یک یا چند مدل زبانی بزرگ وزن‌باز بر پایه‌ی این معیارها انتخاب می‌شود: دسترسی به وزن‌ها و فعال‌سازی‌های درونی، سازگاری با روش‌های تحلیل بازنمایی، نیاز محاسباتی، تناسب با وظیفه‌ی منتخب و وجود مستندات و منابع پشتیبان. Gemma 2 2B [۱۸]، به‌دلیل اندازه‌ی کوچک و وجود خودرمزنگارهای تنک باز Gemma Scope [۱۷]، نامزد اولیه است و انتخاب نهایی نیست."
  - key: methodology-datasets
    placeholder:
      segments:
        - text: "وظایف و مجموعه‌داده‌ها بر پایه‌ی این معیارها انتخاب می‌شوند: ارتباط با پرسش‌های پژوهش، وجود معیار ارزیابی قابل‌اعتماد، تنوع پیامدهای رفتاری، سازگاری با مدل منتخب و امکان اجرا در زمان و منابع در دسترس. پرسش‌وپاسخ دانش‌محور وظیفه‌ی نامزد اولیه است و مجموعه‌داده‌هایی مانند TriviaQA [۲۶]، Natural Questions [۲۷، ۲۸]، PopQA [۲۹] و TruthfulQA [۱۹] گزینه‌های ممکن آن‌اند."
  - key: methodology-behaviors
    placeholder:
      segments:
        - text: "سه کاربرد ممکن بررسی می‌شود: فهم رفتار، یعنی تحلیل الگوهای بازنمایی مرتبط با رفتار؛ ارزیابی رفتار، یعنی بررسی اینکه آیا بازنمایی‌ها به سنجش یا پیش‌بینی پاسخ کمک می‌کنند؛ و مداخله در رفتار، یعنی کاوش اینکه آیا تغییر بازنمایی‌ها پاسخ را تغییر می‌دهد. تشخیص خطای واقعیتی نمونه‌ای مشخص برای دو کاربرد نخست است: درستی پاسخ با پاسخ مرجع سنجیده می‌شود و می‌توان خطاها را بر پایه‌ی الگوی تکرار پاسخ در نمونه‌های چندگانه‌ی یک پرسش تفکیک کرد [۳۴، ۴۱]. تعریف عملیاتی رفتار هدف پس از انتخاب وظیفه ثبت می‌شود."
  - key: methodology-metrics
    placeholder:
      segments:
        - text: "معیارهای ارزیابی پس از تعریف وظیفه و متناسب با آن انتخاب می‌شوند. محورهای ممکن عبارت‌اند از: کارایی پیش‌بینی یا طبقه‌بندی، در صورت کاربرد؛ پایایی و استحکام؛ تعمیم به وظایف یا شرایط دیگر، از جمله داده‌ی "
        - text: "خارج از توزیع"
          en: "out-of-distribution (OOD)"
        - text: "؛ هزینه‌ی محاسباتی؛ و اثرها و پیامدهای جانبی مداخله، اگر مداخله بررسی شود. برای نمونه، در مطالعه‌ی موردی خطای واقعیتی، سنجه‌های تشخیص و کالیبراسیون مناسب‌اند. عدم‌قطعیت آماری نتایج با روش‌هایی مانند "
        - text: "بوت‌استرپ"
          en: "bootstrap resampling over questions"
        - text: " روی پرسش‌ها گزارش می‌شود."
  - key: methodology-baselines
    placeholder:
      segments:
        - text: "در صورت تناسب، تحلیل‌ها با رویکردهای موجود مقایسه می‌شوند: ارزیابی مبتنی بر خروجی، مانند احتمال توکنی، خودارزیابی [۲۰] و آنتروپی معنایی [۲۱، ۲۲]، و روش‌های مبتنی بر بازنمایی، مانند پروب خطی، میانگین تفاضلی [۱۳، ۱۵] و پروب آنتروپی معنایی [۲۵]. برای مداخله، خط‌مبناهای ساده مانند دستورالعمل و بردار خواندن [۱۴، ۱۵] در نظر گرفته می‌شوند. انتخاب روش‌های مقایسه به وظیفه‌ی نهایی و منابع محاسباتی بستگی دارد و هزینه‌ی محاسباتی هر روش در کنار نتایج گزارش می‌شود."
  - key: methodology-analysis
    placeholder:
      segments:
        - text: "تقسیم‌بندی داده پیش از آزمایش‌های اصلی ثابت می‌شود و گزارش نهایی روی داده‌ای جدا از داده‌ی آموزش انجام می‌شود. در صورت امکان، آزمایش‌ها با چند "
        - text: "بذر تصادفی"
          en: "random seed"
        - text: " تکرار می‌شوند و "
        - text: "حذف مؤلفه"
          en: "ablation"
        - text: "، مثلاً روی لایه یا روش تحلیل، و آزمون انتقال میان منابع داده برای سنجش استحکام انجام می‌شوند."
