research-gap:
  segments:
    - text: "پژوهش‌های پیشین نشان داده‌اند که بازنمایی‌های درونی اطلاعاتی درباره‌ی درستی، دانش و عدم‌قطعیت مدل در خود دارند [۶، ۱۳، ۲۳، ۳۲، ۳۴]، و مداخله بر آن‌ها گاه پاسخ را تغییر می‌دهد [۸، ۹، ۱۴، ۳۱]. با این حال، سه پرسش هنوز باز است. نخست، این اطلاعات تا چه اندازه فراتر از ارزیابی مبتنی بر خروجی است، به‌ویژه در هزینه‌ی محاسباتی برابر [۲۱، ۲۵، ۳۷]. دوم، روش‌های تحلیل بازنمایی مانند خودرمزنگارهای تنک در برابر خط‌مبناهای ساده چه سودی دارند، چون شواهد موجود برتری پایدار آن‌ها را نشان نمی‌دهد [۱۵، ۲۴]. سوم، یافته‌های مبتنی بر بازنمایی تا چه اندازه به داده‌ها و وظایف دیگر تعمیم می‌یابند [۳۳، ۳۴]. برای نمونه، در خطای واقعیتی، تشخیص با ویژگی‌های تنک [۳۵، ۳۶] و تفکیک خطاها با نمونه‌گیری [۳۴، ۳۷، ۳۸] جداگانه بررسی شده‌اند، اما ترکیب آن‌ها در آثار بررسی‌شده ارزیابی نشده است. این پژوهش این پرسش‌ها را در دامنه‌ای محدود و بدون بازآموزی مدل هدف بررسی می‌کند. ادعای نوآوری قطعی به پس از مرور نظام‌مند پیشینه موکول می‌شود."
