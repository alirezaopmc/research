intro:
  segments:
    - text: "پژوهش‌های رفتار مدل‌های زبانی بزرگ نشان می‌دهند که کیفیت و ماهیت پاسخ می‌تواند با تغییر وظیفه، زمینه و صورت‌بندی ورودی دگرگون شود. ارزیابی این مدل‌ها از سنجش درستی پاسخ فراتر می‌رود و می‌تواند پایداری، سوگیری، میزان سازگاری با دستور و واکنش به تغییرات موقعیت را نیز دربرگیرد."
development:
  segments:
    - text: "برای مطالعه این رفتارها، پژوهشگران از تحلیل خروجی‌ها، مقایسه عملکرد در موقعیت‌های متفاوت، بررسی بازنمایی‌های درونی و آزمودن روش‌های گوناگون هدایت استفاده کرده‌اند. هر رویکرد جنبه‌ای از رفتار مدل را روشن می‌کند و محدودیت‌های خاص خود را دارد. انتخاب سنجیده رفتارها و روش‌ها، و مقایسه منصفانه آن‌ها در شرایط مشخص، می‌تواند به درک دقیق‌تر قابلیت‌ها و محدودیت‌های مدل‌ها و شناسایی مسیرهای عملی برای بهبود کمک کند."
