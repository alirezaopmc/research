intro:
  segments:
    - text: "پژوهش‌های رفتار مدل‌های زبانی بزرگ نشان می‌دهند که کیفیت و ماهیت پاسخ با تغییر وظیفه یا ورودی دگرگون می‌شود. ارزیابی این مدل‌ها به سنجش درستی پاسخ محدود نمی‌ماند. پایداری، سوگیری، پیروی از دستورالعمل و واکنش به تغییر موقعیت را نیز دربر می‌گیرد."
development:
  segments:
    - text: "برای مطالعه‌ی این رفتارها، پژوهشگران خروجی‌ها را تحلیل کرده‌اند، عملکرد را در موقعیت‌های گوناگون مقایسه کرده‌اند، بازنمایی‌های درونی را بررسی کرده‌اند و روش‌های هدایت را آزموده‌اند. هر رویکرد جنبه‌ای از رفتار را روشن می‌کند و محدودیت‌های خود را دارد. انتخاب سنجیده‌ی رفتارها و روش‌ها و مقایسه‌ی منصفانه‌ی آن‌ها در شرایط مشخص، درک دقیق‌تری از توانایی‌ها و محدودیت‌های مدل‌ها و مسیرهای بهبود آن‌ها فراهم می‌کند."
tools:
  - segments:
      - text: "منابع باز خودرمزنگار تنک برای مدل‌های زبانی بزرگ وزن‌باز [۱۷] تحلیل ویژگی‌های درونی را بدون آموزش لغت‌نامه از صفر ممکن می‌کنند."
  - segments:
      - text: "پژوهش‌های Transformer Circuits، از رشته‌ی انتشارات Anthropic، گراف‌های محاسباتی وابسته به یک ورودی را برای آزمودن فرضیه‌هایی درباره‌ی نقش مفاهیم و گام‌های میانی به کار برده‌اند. نمونه‌های منتشرشده، از جمله بازیابی واقعیت با چند گام، برنامه‌ریزی برای قافیه، محاسبه و پردازش چندزبانه را پوشش می‌دهند [۸، ۹]."
  - segments:
      - text: "گراف‌های محاسباتی تنها بخشی از محاسبه را پوشش می‌دهند و جایگزینی بخشی از محاسبه‌ی مدل با ابزار تفسیر ممکن است نتایج را تغییر دهد. در یکی از این مطالعات، پژوهشگران تخمین زده‌اند که برای حدود یک‌چهارم ورودی‌های آزموده‌شده بینشی رضایت‌بخش به دست آمده است. آنان تأکید می‌کنند که این نسبت دقیقاً سنجیده نیست و موارد تشریح‌شده نمونه‌های موفق‌اند [۹]."
synthesis:
  paragraphs:
    - segments:
        - text: "رفتار مدل‌های زبانی بزرگ [۳، ۴، ۵، ۷، ۱۹، ۴۱]: ارزیابی رفتاری نظام‌مند و خودکار [۳، ۴] نشان می‌دهد مدل‌ها در کدام وظایف و با چه عدم‌قطعیتی پاسخ می‌دهند، و طبقه‌بندی خطرهای آسیب و سوگیری [۷] دامنه‌ی این سنجش‌ها را مشخص می‌کند. تعریف و سنجش خطای واقعیتی بر مرور توهم در تولید زبان طبیعی [۵] و معیار TruthfulQA [۱۹] استوار است. "
        - text: "گکمن"
          en: "Gekhman et al."
        - text: " و همکاران [۴۱] نمونه‌ها را بر اساس سازگاری پاسخ‌های نمونه‌گیری‌شده با پاسخ مرجع به دسته‌های «معلوم» و «نامعلوم» تقسیم کرده‌اند و نشان داده‌اند که یادگیری حقایق نامعلوم با افزایش توهم همراه است. شکاف این محور آن است که این پژوهش‌ها رفتار را از بیرون توصیف می‌کنند، اما سازوکار درونی تولید پاسخ را تبیین نمی‌کنند."
    - segments:
        - text: "بازنمایی‌های درونی [۶، ۱۳، ۳۰، ۳۲، ۳۳]: "
        - text: "مارکس"
          en: "Marks"
        - text: " و "
        - text: "تگمارک"
          en: "Tegmark"
        - text: " [۱۳] ساختار خطی درستی گزاره‌های ساده را در مدل‌های بزرگ گزارش کرده‌اند. "
        - text: "برنز"
          en: "Burns et al."
        - text: " و همکاران [۳۰] بدون نظارت انسانی جهتی یافته‌اند که با درستی گزاره‌ها سازگار است، و "
        - text: "آزاریا"
          en: "Azaria"
        - text: " و "
        - text: "میچل"
          en: "Mitchell"
        - text: " [۳۲] نشان داده‌اند که طبقه‌بندی ساده روی حالت درونی می‌تواند نادرستی برخی گزاره‌ها را پیش‌بینی کند. "
        - text: "سیمهی"
          en: "Simhi et al."
        - text: " و همکاران [۶] نشان داده‌اند که خطای ناشی از فقدان دانش را می‌توان تا حدی با پروب خطی روی حالت درونی از خطای با وجود دانش جدا کرد. شکاف این محور آن است که این شواهد بیشتر همبستگی‌اند و نقش علّی بازنمایی را لزوماً نشان نمی‌دهند، و تعمیم آشکارسازهای مبتنی بر بازنمایی به داده‌های خارج از توزیع ضعیف گزارش شده است [۳۳]."
    - segments:
        - text: "روش‌های تحلیل بازنمایی: پروب و خودرمزنگار تنک [۱۰، ۱۱، ۱۲، ۱۶، ۱۷، ۲۴، ۳۵، ۳۶، ۳۹، ۴۰]: "
        - text: "هوبن"
          en: "Huben et al."
        - text: " و همکاران [۱۰] و "
        - text: "بریکن"
          en: "Bricken et al."
        - text: " و همکاران [۱۱] نشان داده‌اند که لغت‌نامه‌های تنک می‌توانند ویژگی‌های تفسیرپذیرتری از نورون‌های منفرد استخراج کنند. مرور [۱۲] و کار "
        - text: "تمپلتون"
          en: "Templeton et al."
        - text: " و همکاران [۱۶] روش و مقیاس‌پذیری این رویکرد را پوشش می‌دهند، و گزارش Gemma Scope [۱۷] منبعی باز برای مدل‌های Gemma 2 فراهم می‌کند. "
        - text: "کانتامنی"
          en: "Kantamneni et al."
        - text: " و همکاران [۲۴] در ۱۱۳ مجموعه‌داده نشان داده‌اند که پروب‌های مبتنی بر خودرمزنگار برتری پایدار ندارند. در کاربرد به خطا، چن و همکاران [۳۵] ویژگی‌های Gemma Scope را برای تشخیص توهم آزموده‌اند، "
        - text: "پاتل"
          en: "Patel et al."
        - text: " و همکاران [۳۶] جهت‌های عدم‌قطعیت و نادرستی را با ویژگی‌های تنک جدا کرده‌اند، "
        - text: "عبدالجلیل"
          en: "Abdaljalil et al."
        - text: " و همکاران [۳۹] خودرمزنگار را برای غنی‌سازی پرس‌وجو پس از آشکارسازی احتمال توهم به کار برده‌اند، و "
        - text: "سورش"
          en: "Suresh et al."
        - text: " و همکاران [۴۰] نشان داده‌اند که توهم را می‌توان از الگوی مفاهیم فعال‌شده در لایه‌های میانی پیش‌بینی کرد. شکاف این محور آن است که سود این روش‌ها در برابر خط‌مبناهای ساده روی بازنمایی خام هنوز روشن نیست."
    - segments:
        - text: "ارزیابی مبتنی بر خروجی و بازنمایی [۲۰، ۲۱، ۲۲، ۲۵، ۳۴، ۳۷، ۳۸]: "
        - text: "کاداوات"
          en: "Kadavath et al."
        - text: " و همکاران [۲۰] نشان داده‌اند که مدل‌ها تا حدی در ارزیابی احتمال درستی پاسخ‌های خود کالیبره‌اند. آنتروپی معنایی [۲۱، ۲۲] و سازگاری میان نمونه‌ها تنها به خروجی مدل تکیه دارند و هزینه‌ی نمونه‌گیری چندباره را دارند. "
        - text: "کاسن"
          en: "Kossen et al."
        - text: " و همکاران [۲۵] نشان داده‌اند که پروب روی فعال‌سازی‌های یک پاسخ می‌تواند آنتروپی معنایی را با هزینه‌ی کم تقریب بزند. اورگاد و همکاران [۳۴] نشان داده‌اند اطلاعات درستی در توکن‌های پاسخ دقیق متمرکز است، اما آشکارسازهای آنان در مجموعه‌داده‌های دیگر تعمیم نیافته‌اند. "
        - text: "گنش"
          en: "Ganesh et al."
        - text: " و همکاران [۳۷] نشان داده‌اند که آشکارسازهای مبتنی بر پاسخ بیشتر سازگاری را می‌سنجند تا درستی، و "
        - text: "چاوهان"
          en: "Chauhan"
        - text: " [۳۸] طبقه‌بندی دوبعدی سازگاری و اطمینان را پیشنهاد کرده است. شکاف این محور آن است که روشن نیست بازنمایی‌های درونی چه اطلاعاتی فراتر از ارزیابی مبتنی بر خروجی فراهم می‌کنند."
    - segments:
        - text: "مداخله و هدایت [۸، ۹، ۱۴، ۱۵، ۳۱]: "
        - text: "زو"
          en: "Zou et al."
        - text: " و همکاران [۱۴] نشان داده‌اند که برخی جهت‌های خطی در فضای فعال‌سازی با رفتار هدف همراه‌اند و مداخله بر آن‌ها می‌تواند پاسخ را تغییر دهد. "
        - text: "لی"
          en: "Li et al."
        - text: " و همکاران [۳۱] نشان داده‌اند که جابه‌جایی فعال‌سازی برخی سرهای توجه در جهت‌های مرتبط با صداقت، پاسخ‌های راستگوتری تولید می‌کند، و مطالعات ردیابی مدار [۸، ۹] اثر مداخله بر ویژگی‌های میانی را برای ورودی‌های مشخص نشان داده‌اند. در مقابل، "
        - text: "وو"
          en: "Wu et al."
        - text: " و همکاران [۱۵] در AxBench نشان داده‌اند که خط‌مبنای ساده‌ی دستورالعمل در هدایت از خودرمزنگارها بهتر عمل می‌کند. شکاف این محور آن است که شواهد مداخله‌ای بیشتر موضعی‌اند و اثرهای جانبی و برتری آن‌ها بر روش‌های ساده هنوز روشن نیست."
    - segments:
        - text: "جمع‌بندی: این پنج محور یک پرسش مشترک را باز می‌گذارند. بازنمایی‌های درونی، در مقایسه با ارزیابی مبتنی بر خروجی و خط‌مبناهای ساده، تا چه اندازه اطلاعات سودمند و قابل‌اعتمادی درباره‌ی رفتار مدل فراهم می‌کنند؟ صورت‌بندی این شکاف در ⁦۴-۳-۲⁩ آمده است."
