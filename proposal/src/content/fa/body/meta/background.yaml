intro:
  segments:
    - text: "پژوهش‌های اخیر نشان می‌دهند توهم مدل‌های زبانی بزرگ صرفاً خطای سطحی نیست؛ اغلب از نحوه توزیع اطلاعات در فضای درونی مدل ناشی می‌شود. رویکردهای "
    - text: "کاوش خطی"
      en: "Linear Probing"
    - text: " و "
    - text: "تحلیل مدار"
      en: "Circuit Analysis"
    - text: " تلاش کرده‌اند مسیرهای محاسباتی مرتبط با "
    - text: "رفتار مبتنی بر واقعیت"
      en: "Factual Behavior"
    - text: " را ردیابی کنند، اما مقیاس‌پذیری محدود است."
development:
  segments:
    - text: "خودرمزنگارهای پراکنده با گسترش فعال‌سازی‌ها به ویژگی‌های پراکنده و نسبتاً تک‌معنایی، پلی میان مقیاس مدل و تفسیر انسانی فراهم کرده‌اند. کارهای "
    - text: "بریکن و همکاران"
      en: "Bricken et al. (2023), Towards Monosemanticity"
    - text: " و "
    - text: "گائو و همکاران"
      en: "Gao et al. (2024), Scaling and Evaluating Sparse Autoencoders"
    - text: " نشان داده‌اند خودرمزنگارهای پراکنده می‌توانند مفاهیم قابل فهم استخراج کنند؛ اتصال مستقیم آن‌ها به آگاهی از دانش و کاهش توهم هنوز باز است."
