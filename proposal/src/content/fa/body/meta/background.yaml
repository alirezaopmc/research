intro:
  segments:
    - text: "پژوهش‌های رفتار مدل‌های زبانی بزرگ نشان می‌دهند که کیفیت و ماهیت پاسخ می‌تواند با تغییر وظیفه، زمینه و صورت‌بندی ورودی دگرگون شود. ارزیابی این مدل‌ها از سنجش درستی پاسخ فراتر می‌رود و می‌تواند پایداری، سوگیری، میزان سازگاری با دستور و واکنش به تغییرات موقعیت را نیز دربرگیرد."
development:
  segments:
    - text: "برای مطالعه‌ی این رفتارها، پژوهشگران از تحلیل خروجی‌ها، مقایسه‌ی عملکرد در موقعیت‌های متفاوت، بررسی بازنمایی‌های درونی و آزمودن روش‌های گوناگون هدایت استفاده کرده‌اند. هر رویکرد جنبه‌ای از رفتار مدل را روشن می‌کند و محدودیت‌های خاص خود را دارد. انتخاب سنجیده‌ی رفتارها و روش‌ها، و مقایسه‌ی منصفانه‌ی آن‌ها در شرایط مشخص، می‌تواند به درک دقیق‌تر قابلیت‌ها و محدودیت‌های مدل‌ها و شناسایی مسیرهای عملی برای بهبود کمک کند."
tools:
  - segments:
      - text: "این رویکردها پرسش‌های متفاوتی را دنبال می‌کنند. مجموعه‌ی ابزارهای Gemma Scope [۱۷] امکان بررسی "
      - text: "لایه‌به‌لایه"
        en: "layer-by-layer"
      - text: " مدل‌های Gemma 2 را فراهم می‌کند؛ نسخه‌ی دوم آن [۱۸] برای مدل‌های Gemma 2 از یک میلیارد تا ۲۷ میلیارد پارامتر، ابزارهایی برای مطالعه‌ی "
      - text: "محاسبات چندمرحله‌ای"
        en: "multi-step computations"
      - text: " نیز دارد. این زیرساخت می‌تواند به بررسی پدیده‌هایی مانند "
      - text: "سازوکارهای امتناع"
        en: "refusal mechanisms"
      - text: "، "
      - text: "جیلبریک"
        en: "jailbreaks"
      - text: " و "
      - text: "توهم"
        en: "hallucination"
      - text: " کمک کند [۱۷–۱۸]. بررسی "
      - text: "همخوانی توضیح مدل با پردازش درونی"
        en: "reasoning faithfulness"
      - text: " نیز با این زیرساخت ممکن است، هرچند پژوهش‌های Transformer Circuits این پرسش را مستقیم‌تر دنبال می‌کنند [۸–۹]. لازم به ذکر است که این‌ها مسیرهای پژوهشی‌اند، نه تضمینِ حل این مسائل."
  - segments:
      - text: "در پژوهش‌های Transformer Circuits و Anthropic [۸–۹]، گراف‌های محاسباتیِ وابسته به یک ورودی برای آزمودن فرضیه‌هایی درباره‌ی نقش مفاهیم و گام‌های میانی به‌کار رفته‌اند. نمونه‌های منتشرشده، از جمله "
      - text: "بازیابی واقعیت با چند گام"
        en: "multi-hop factual recall"
      - text: "، برنامه‌ریزی برای قافیه، محاسبه و پردازش چندزبانه را پوشش می‌دهند [۸–۹]. گراف‌ها بخشی از محاسبه را پوشش می‌دهند و ممکن است تحت تأثیر جایگزینی بخشی از محاسبه‌ی مدل با ابزار تفسیر قرار گیرند. در یکی از این مطالعات، پژوهشگران به‌طور تقریبی گزارش می‌کنند که برای حدود یک‌چهارم ورودی‌هایی که آزموده‌اند، بینشی رضایت‌بخش به دست آمده است؛ آن‌ها تأکید می‌کنند که این نسبت به‌سختی قابل سنجش است و موارد تشریح‌شده، نمونه‌های موفق‌اند [۹]."
synthesis:
  paragraphs:
    - segments:
        - text: "چارچوب‌های کل‌نگر و ارزیابی رفتاری [۳–۴، ۷]: لیانگ و همکاران [۳]، پرز و همکاران [۴] و ویدینگر و همکاران [۷] رویکردهای ارزیابی سیستماتیک، "
        - text: "آزمون‌های خودکار"
          en: "automated tests"
        - text: " و تحلیل ریسک‌های سوگیری و عدم قطعیت را پوشش می‌دهند؛ نقطه‌ی قوت این آثار گستره‌ی پوشش و کاستی‌شان تبیین سازوکار درونی مدل‌ها است."
    - segments:
        - text: "بازنمایی‌های درونی، کالیبراسیون و هدایت [۱۳–۱۴، ۲۱]: زو و همکاران [۱۴] و مارکس و تگمارک [۱۳] نشان می‌دهند که برخی جهت‌های خطی در فضای "
        - text: "بردار فعال‌سازی"
          en: "activation vector"
        - text: " با درستی گزاره‌ها یا رفتار هدف همراه‌اند و مداخله روی آن‌ها می‌تواند پاسخ را تغییر دهد. کاداوات و همکاران [۲۱] نیز نشان می‌دهند که مدل‌ها در ارزیابی درستی پاسخ‌های خود از کالیبراسیون نسبی برخوردارند. دشواری کار، تفکیک "
        - text: "ویژگی‌های درهم‌تنیده"
          en: "entangled features"
        - text: " و محدودیت منابع پردازشی است."
    - segments:
        - text: "خودرمزنگارهای تنک [۱۰–۱۲، ۱۶–۱۷]: کانینگهام و همکاران [۱۰] و بریکن و همکاران [۱۱] نشان دادند که فرهنگ‌لغت‌های تنک می‌توانند ویژگی‌هایی تفسیرپذیرتر از نورون‌های منفرد استخراج کنند. مرور [۱۲] و کار تمپلتون و همکاران [۱۶] جزئیات روش و مقیاس‌پذیری آن را پوشش می‌دهند؛ گزارش Gemma Scope [۱۷] و نسخه‌ی دوم آن [۱۸] منابع باز برای مدل‌های Gemma را فراهم می‌کنند."
    - segments:
        - text: "شواهد ارزیابی خودرمزنگارها [۱۵، ۲۵]: کانتامنی و همکاران [۲۵] در ۱۱۳ مجموعه‌داده و چهار رژیم دشوار نشان دادند که پروب‌های مبتنی بر خودرمزنگار برتری پایداری نسبت به خط‌مبناهای قوی ندارند. فراتر از آن، وو و همکاران [۱۵] در AxBench روی Gemma-2 نشان دادند که حتی خط‌مبنای ساده‌ی دستور در هدایت بهتر عمل می‌کند، خودرمزنگارها در هدایت و تشخیص مفهوم رقابتی نیستند، و میانگین تفاضلی در تشخیص مفهوم بهترین نتیجه را به دست می‌دهد."
    - segments:
        - text: "خطای واقعیتی و معیارهای آن [۵–۶، ۲۰]: مرور توهم در تولید زبان طبیعی [۵] و معیار TruthfulQA [۲۰] چارچوب تعریف و سنجش خطای واقعیتی را فراهم می‌کنند. سیمهی و همکاران [۶] نشان داده‌اند که مدل‌های متفاوت روی نمونه‌های متفاوت دچار خطا می‌شوند و خطای ناشی از فقدان دانش را با پروب‌های خطی روی حالت درونی تا حدی می‌توان از خطای با وجود دانش جدا کرد؛ مارکس و تگمارک [۱۳] نیز گزارش می‌کنند که در مدل‌های بزرگ، ساختار خطی درستی گزاره‌های ساده وجود دارد."
    - segments:
        - text: "عدم قطعیت، خودارزیابی و حالت درونی [۲۱–۲۳، ۲۶]: آنتروپی معنایی و سازگاری نمونه‌گیری‌شده تنها به خروجی مدل تکیه دارند و خط‌مبنای طبیعی برای سنجش خطای ناسازگار به شمار می‌روند؛ اما آن‌ها سازوکار درونی را توضیح نمی‌دهند. کاداوات و همکاران [۲۱] خودارزیابی مدل را بررسی کرده‌اند و کاسن و همکاران [۲۶] نشان داده‌اند که پروب‌های روی فعال‌سازی‌های یک پاسخ می‌توانند آنتروپی معنایی را با هزینه‌ی کم تقریب بزنند."
comparison:
  caption: "مقایسه‌ی چهار خانواده‌ی پژوهشی در پیشینه."
  headers:
    family: "خانواده‌ی پژوهش"
    shows: "آنچه نشان می‌دهد"
    limits: "آنچه نمی‌تواند نشان دهد"
  rows:
    - family: "ارزیابی رفتاری [۳–۴، ۷]"
      shows: "پوشش گسترده‌ی رفتارها، آزمون‌های خودکار، سنجش سوگیری و عدم قطعیت"
      limits: "سازوکار درونی تولید پاسخ"
    - family: "بازنمایی‌های درونی، کالیبراسیون و هدایت [۱۳–۱۴، ۲۱]"
      shows: "ارتباط بازنمایی‌ها با رفتار؛ امکان تغییر پاسخ از راه مداخله"
      limits: "تفکیک ویژگی‌های درهم‌تنیده؛ محدودیت منابع پردازشی"
    - family: "خودرمزنگارهای تنک [۱۰–۱۲، ۱۶–۱۷]"
      shows: "جداسازی ویژگی‌ها در مقیاس بزرگ؛ منابع باز برای مدل‌های Gemma"
      limits: "در برابر خط‌مبناهای قوی، برتری پایدار نشان نداده‌اند [۱۵، ۲۵]"
    - family: "شناسایی خطای واقعیتی از حالت درونی [۶، ۲۴، ۲۶]"
      shows: "تفکیک خطای با دانش و بدون دانش؛ هدایت پذیرش یا خیال‌پردازی با جهت‌های خودرمزنگار؛ پروب کم‌هزینه‌ی آنتروپی معنایی"
      limits: "در مرور اولیه، مقایسه‌ی هم‌زمان خودرمزنگار با پروب خام و پروب آنتروپی معنایی در یک طرح ثابت برای خطای واقعیتی دیده نشد"
research-gap:
  segments:
    - text: "شکاف پژوهشی"
      en: "research gap"
    - text: ": بر اساس مرور اولیه، فرّاندو و همکاران [۲۴] نشان داده‌اند که جهت‌های خودرمزنگار برای بازشناسی موجودیت، هدایت پذیرش یا خیال‌پردازی را ممکن می‌کنند؛ سیمهی و همکاران [۶] خطای ناشی از فقدان دانش را از خطای با وجود دانش تفکیک کرده‌اند؛ کاسن و همکاران [۲۶] پروب آنتروپی معنایی را با هزینه‌ی محاسباتی پایین پیشنهاد داده‌اند؛ و وو و همکاران [۱۵] و کانتامنی و همکاران [۲۵] نشان داده‌اند که خودرمزنگارها در برابر خط‌مبناهای قوی برتری پایدار ندارند. آنچه در پیشینه کمتر بررسی شده، مقایسه‌ی کنترل‌شده و هم‌زمان ویژگی‌های خودرمزنگار تنک برای تفکیک خطای سازگار از خطای ناسازگار در پرسش‌وپاسخ دانش‌محور است، در برابر پروب خطی روی بازنمایی خام، پروب آنتروپی معنایی و میانگین تفاضلی، همراه با آزمون خارج از توزیع و با بودجه‌ی محاسباتی در دسترس. این پژوهش همین مقایسه را بدون بازآموزی مدل هدف قرار می‌دهد و نتیجه‌ی تهی را نیز یافته‌ای معتبر می‌داند."
