intro:
  segments:
    - text: "پژوهش‌های رفتار مدل‌های زبانی بزرگ نشان می‌دهند که کیفیت و ماهیت پاسخ می‌تواند با تغییر وظیفه، زمینه و صورت‌بندی ورودی دگرگون شود. ارزیابی این مدل‌ها از سنجش درستی پاسخ فراتر می‌رود و می‌تواند پایداری، سوگیری، میزان سازگاری با دستور و واکنش به تغییرات موقعیت را نیز دربرگیرد."
development:
  segments:
    - text: "برای مطالعه این رفتارها، پژوهشگران از تحلیل خروجی‌ها، مقایسه عملکرد در موقعیت‌های متفاوت، بررسی بازنمایی‌های درونی و آزمودن روش‌های گوناگون هدایت استفاده کرده‌اند. هر رویکرد جنبه‌ای از رفتار مدل را روشن می‌کند و محدودیت‌های خاص خود را دارد. انتخاب سنجیده رفتارها و روش‌ها، و مقایسه منصفانه آن‌ها در شرایط مشخص، می‌تواند به درک دقیق‌تر قابلیت‌ها و محدودیت‌های مدل‌ها و شناسایی مسیرهای عملی برای بهبود کمک کند."
tools:
  - segments:
      - text: "این رویکردها پرسش‌های متفاوتی را دنبال می‌کنند. مجموعه‌ی باز ابزارهای Gemma Scope [۷] امکان بررسی "
      - text: "لایه‌به‌لایه"
        en: "layer-by-layer"
      - text: " مدل‌های Gemma را فراهم می‌کند؛ نسخه‌ی دوم آن [۸] برای مدل‌های Gemma 3 ابزارهایی برای مطالعه‌ی "
      - text: "محاسبات چندمرحله‌ای"
        en: "multi-step computations"
      - text: " نیز دارد. این زیرساخت می‌تواند به بررسی پدیده‌هایی مانند "
      - text: "سازوکارهای امتناع"
        en: "refusal mechanisms"
      - text: "، "
      - text: "جیلبریک"
        en: "jailbreaks"
      - text: "، "
      - text: "توهم"
        en: "hallucination"
      - text: " و "
      - text: "همخوانی توضیح مدل با پردازش درونی"
        en: "reasoning faithfulness"
      - text: " کمک کند [۷–۸]. این‌ها مسیرهای پژوهشی‌اند، نه تضمینِ حل این مسائل."
  - segments:
      - text: "در پژوهش‌های Transformer Circuits و Anthropic [۹–۱۰]، گراف‌های محاسباتیِ وابسته به یک ورودی برای آزمودن فرضیه‌هایی درباره‌ی نقش مفاهیم و گام‌های میانی به‌کار رفته‌اند. نمونه‌های منتشرشده، از جمله "
      - text: "بازیابی واقعیت با چند گام"
        en: "multi-hop factual recall"
      - text: "، برنامه‌ریزی برای قافیه، محاسبه و پردازش چندزبانه را پوشش می‌دهند [۹–۱۱]. گراف‌ها بخشی از محاسبه را پوشش می‌دهند و ممکن است تحت تأثیر جایگزینی بخشی از محاسبه‌ی مدل با ابزار تفسیر قرار گیرند. در یکی از این مطالعات، پژوهشگران به‌طور تقریبی گزارش می‌کنند که برای حدود یک‌چهارم ورودی‌هایی که آزموده‌اند، بینشی رضایت‌بخش به دست آمده است؛ آن‌ها تأکید می‌کنند که این نسبت به‌سختی قابل سنجش است و موارد تشریح‌شده، نمونه‌های موفق‌اند [۱۱]."
synthesis:
  paragraphs:
    - segments:
        - text: "چارچوب‌های کل‌نگر و ارزیابی رفتاری [۱–۳]: لیانگ و همکاران [۱]، پرز و همکاران [۲] و ویدینگر و همکاران [۳] رویکردهای ارزیابی سیستماتیک، "
        - text: "آزمون‌های خودکار"
          en: "automated tests"
        - text: " و تحلیل ریسک‌های سوگیری و عدم قطعیت را پوشش می‌دهند؛ نقطه‌ی قوت این آثار گستره‌ی پوشش و کاستی‌شان تبیین سازوکار درونی مدل‌ها است."
    - segments:
        - text: "بازنمایی‌های درونی، کالیبراسیون و هدایت [۴، ۵، ۱۴]: زو و همکاران [۴] و مارکس و تگمارک [۱۴] نشان می‌دهند که برخی جهت‌های خطی در فضای "
        - text: "بردار فعال‌سازی"
          en: "activation vector"
        - text: " با درستی گزاره‌ها یا رفتار هدف همراه‌اند و مداخله روی آن‌ها می‌تواند پاسخ را تغییر دهد. کاداوات و همکاران [۵] نیز نشان می‌دهند که مدل‌ها تا حدی درباره‌ی درستی پاسخ‌های خود داوری کالیبره‌شده دارند. دشواری کار، تفکیک "
        - text: "ویژگی‌های درهم‌تنیده"
          en: "entangled features"
        - text: " و محدودیت منابع پردازشی است."
    - segments:
        - text: "خودرمزنگارهای تنک [۱۵–۱۷]: ابزارهای جداسازی ویژگی در مقیاس بزرگ، از جمله گزارش Gemma Scope [۱۵] و مرور [۱۶]، جزئیات معماری و ارزیابی این روش‌ها را پوشش می‌دهند؛ مقیاس‌پذیری آن‌ها روی مدل‌های Claude [۱۷] نیز نشان داده شده است. بر اساس مرور اولیه، شواهد منتشرشده درباره‌ی کاربرد آن‌ها در تشخیص خطای واقعیتی محدود است."
    - segments:
        - text: "خطای واقعیتی و معیارهای آن [۱۸، ۲۵]: مرور توهم در تولید زبان طبیعی [۱۸] و معیار TruthfulQA [۲۵] چارچوب تعریف و سنجش خطای واقعیتی را فراهم می‌کنند؛ مارکس و تگمارک [۱۴] نیز گزارش می‌کنند که در مدل‌های بزرگ، بازنمایی خطی درستی گزاره‌های ساده وجود دارد."
    - segments:
        - text: "عدم قطعیت و خودارزیابی رفتاری [۱۹، ۲۰]: آنتروپی معنایی و سازگاری نمونه‌گیری‌شده تنها به خروجی مدل تکیه دارند و خط‌مبنای طبیعی برای سنجش «ندانستن» به شمار می‌روند؛ اما آن‌ها سازوکار درونی را توضیح نمی‌دهند."
comparison:
  caption: "مقایسه‌ی سه خانواده‌ی پژوهشی در پیشینه."
  headers:
    family: "خانواده‌ی پژوهش"
    shows: "آنچه نشان می‌دهد"
    limits: "آنچه نمی‌تواند نشان دهد"
  rows:
    - family: "ارزیابی رفتاری [۱–۳]"
      shows: "پوشش گسترده‌ی رفتارها، آزمون‌های خودکار، سنجش سوگیری و عدم قطعیت"
      limits: "سازوکار درونی تولید پاسخ"
    - family: "بازنمایی‌های درونی، کالیبراسیون و هدایت [۴، ۵، ۱۴]"
      shows: "ارتباط بازنمایی‌ها با رفتار؛ امکان تغییر پاسخ از راه مداخله"
      limits: "تفکیک ویژگی‌های درهم‌تنیده؛ محدودیت منابع پردازشی"
    - family: "خودرمزنگارهای تنک [۱۵–۱۷]"
      shows: "جداسازی ویژگی‌ها در مقیاس بزرگ؛ منابع باز برای مدل‌های Gemma"
      limits: "شواهد محدود درباره‌ی تشخیص خطای واقعیتی؛ اعتبار ویژگی‌ها برای هر وظیفه باید سنجیده شود"
research-gap:
  segments:
    - text: "شکاف پژوهشی"
      en: "research gap"
    - text: ": بر اساس مرور اولیه، با وجود پیشرفت در ارزیابی بیرونی رفتار مدل‌ها [۱–۳] و کاوش بازنمایی‌های خطی درستی [۱۴]، مقایسه‌ی منصفانه‌ی ویژگی‌های خودرمزنگارهای تنک برای تشخیص زودهنگام خطای واقعیتی در مدل‌های متن‌باز با منابع محدود، در برابر خط‌مبناهای ساده (آنتروپی، سازگاری نمونه‌گیری‌شده و پروب خطی روی بازنمایی خام) کم‌تر بررسی شده است. این پژوهش همین مقایسه‌ی کنترل‌شده را با هزینه‌ی محاسباتی پایین و بدون بازآموزی مدل هدف قرار می‌دهد."
